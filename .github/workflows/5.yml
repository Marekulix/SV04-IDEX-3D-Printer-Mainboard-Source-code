      - name: Host safety tests 23 through 27 (real OEM regression)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          for block in 23 24 25 26 27; do
            bash tests/run_block${block}_local.sh 2>&1 | tee evidence/host-${block}.log
          done
      - name: Apply corrected exact-source native patch 27
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 integration/apply_native_guard_v33.py --root . --evidence evidence/overlay.json 2>&1 | tee evidence/patch.log
          git diff --exit-code -- Marlin/Configuration.h Marlin/src/module/probe.cpp
          git diff --check
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          q=Path('Marlin/src/gcode/queue.h').read_text()
          assert 'static bool has_commands_queued() { return ring_buffer.length || injected_commands_P || injected_commands[0]; }' in q
          r=Path('Marlin/src/lcd/e3v2/creality/LCD_RTS.cpp').read_text()
          assert 'const bool sv04_next_gcode_queue_empty = !queue.has_commands_queued();' in r
          assert 'n.motion_queued = planner.has_blocks_queued() || !sv04_next_gcode_queue_empty;' in r
          end=Path('Marlin/src/module/endstops.cpp').read_text()
          assert 'GCODE_QUEUE_EMPTY_AT_SAMPLE' in end
          assert 'SV04NEXT AUTO_COMMAND_DISPATCH: DISABLED' in end
          g=Path('Marlin/src/gcode/bedlevel/abl/G29.cpp').read_text()
          assert g.count('rtscheck.RTS_SndData(')==3, 'two original OEM display writes + one experimental icon write required'
          print('NATIVE_QUEUE_SNAPSHOT_AND_NO_ACTUATOR_PASS')
          PY_VERIFY
          git status --short > evidence/source-changes.txt
      - name: Install PlatformIO
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install platformio==6.1.18
      - name: Native STM32 build without flashing
        shell: bash
        run: |
          set -euo pipefail
          pio run -e STM32F103RET6_creality 2>&1 | tee evidence/compile.log
          test -s .pio/build/STM32F103RET6_creality/firmware.bin
          sha256sum .pio/build/STM32F103RET6_creality/firmware.bin > evidence/firmware-hash-only.txt
          echo 'BUILD_OK_DO_NOT_FLASH' > evidence/build-result.txt
      - name: Collect evidence only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf '%s\n' 'NICHT FLASHEN: only source-level native compilation, no T1 hardware certificate, no new DWIN button, no EEPROM automation.' > evidence/READ_ME_FIRST.txt
          git rev-parse HEAD > evidence/original-revision.txt
          git status --short > evidence/source-changes.txt
      - name: '5'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: '5'
          path: evidence/
          if-no-files-found: error
