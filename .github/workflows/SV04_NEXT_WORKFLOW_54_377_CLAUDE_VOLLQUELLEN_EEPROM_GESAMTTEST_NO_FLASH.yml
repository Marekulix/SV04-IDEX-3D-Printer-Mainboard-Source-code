        run: |
          set -uo pipefail
          mkdir -p evidence/sv04_377/fullchain
          rc=0
          for f in Marlin_src_module_settings.cpp Marlin_src_HAL_STM32_eeprom_bl24cxx.cpp Marlin_src_gcode_eeprom_M500_M504.cpp; do test -s "export/pre/$f.i" || { echo "FEHLT export/pre/$f.i"; rc=1; }; done
          for sym in EXTENSIBLE_UI EEPROM_AUTO_INIT IIC_BL24CXX_EEPROM; do
            if grep -Eq "^#define $sym( |$)" export/pre/Marlin_src_module_settings.cpp.macros; then echo "$sym=DEFINIERT"; else echo "$sym=NICHT_DEFINIERT"; fi
          done | tee evidence/sv04_377/fullchain/ap_flags.txt
          grep -c 'sv04_prev_mode' export/pre/Marlin_src_module_settings.cpp.i | tee evidence/sv04_377/fullchain/ap_377_in_real_i.txt
          python3 -I t377/test_377.py export/pre evidence/sv04_377/fullchain/lauf --real377 2>&1 | tee evidence/sv04_377/fullchain/test_377_stdout.txt
          [ "${PIPESTATUS[0]}" -eq 0 ] || rc=1
          echo "SV04_377_FULLCHAIN_RC=$rc FLASH_ALLOWED=NO HARDWARE_TESTED=NO" | tee evidence/sv04_377/fullchain/result.txt
          exit "$rc"

      - name: Upload source export (diagnostic only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV04_377_EEPROM_SOURCE_EXPORT_DIAGNOSTIC
          path: export/
          if-no-files-found: ignore

      - name: Archive every log on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV04_377_INTEGRATED_STM32_LOGS_NO_FLASH
          path: evidence/
          if-no-files-found: warn

  evaluate_builds:
    name: "Evaluate both build jobs (no blanket success; red unless all four combinations are proven PASS)"
    runs-on: ubuntu-24.04
    needs: [baseline_c12, c13_changes]
    if: always()
    steps:
      - name: Checkout input files
        uses: actions/checkout@v4
      - name: Verify and unpack the C9 package (evaluator; resolved by prefix + SHA-256)
        shell: bash
        run: |
          set -euo pipefail
          resolve() {
            # Android haengt bei Mehrfach-Uploads " (1)" an. Datei wird ueber Namenspraefix UND SHA-256 gefunden, nie ueber den exakten Namen.
            local prefix="$1" hash="$2" f
            shopt -s nullglob
            for f in "$prefix"*.zip; do
              if [ "$(sha256sum -- "$f" | cut -d' ' -f1)" = "$hash" ]; then printf '%s' "$f"; return 0; fi
            done
            echo "FEHLT: keine Datei '$prefix*.zip' mit sha256 $hash im Repository-Stamm" >&2; ls -la >&2; return 1
          }
          F9="$(resolve SV04_NEXT_CLAUDE_C9_IDEX_BLTOUCH_G28_ABSCHLUSS d7af0fa681d03112defd3b58618d3eef573ccc72d2d29a7efb7e5431e638a5eb)"
          echo "d7af0fa681d03112defd3b58618d3eef573ccc72d2d29a7efb7e5431e638a5eb  $F9" | sha256sum -c -
          unzip -q "$F9" -d c9pkg
      - name: Download both build artifacts (whatever exists)
        uses: actions/download-artifact@v4
        with:
          pattern: SV04_377_*_STM32_LOGS_NO_FLASH
          path: art
      - name: Evaluate (exit code 0 only if oem_c12 and oem_c13 are PASS for both profiles)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evaluation
          find art -type f \( -path '*/c12_base/integrated_backend/result.txt' -o -path '*/c12_base/integrated_failclosed/result.txt' -o -path '*/c13/integrated_backend/result.txt' -o -path '*/c13/integrated_failclosed/result.txt' \) -print | sort | tee evaluation/FOUND_RESULTS.txt
          test "$(wc -l < evaluation/FOUND_RESULTS.txt)" -eq 4
          python3 c9pkg/02_PATCHES/evaluate_builds_c9.py art --trees oem_c12,oem_c13 --out evaluation/EVALUATION.md 2>&1 | tee evaluation/evaluation_stdout.txt
          exit "${PIPESTATUS[0]}"
      - name: Upload evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV04_377_BUILD_EVALUATION_W47
          path: evaluation/
          if-no-files-found: warn