          echo '6bb7341508e45fae23a15b33552b25f9b704875689101ae0e5b47496966af5ab  oem_c13/Marlin/src/lcd/e3v2/creality/LCD_RTS.h' | sha256sum -c -
          echo '8ab2a786d637c34ff051c6b6b230a9e983ec40bb679086de7249bbb84a7ac6da  oem_c13/Marlin/src/lcd/e3v2/creality/sv04_dwin_hmi_bindings.h' | sha256sum -c -
          echo 'a597f0d1fdd08f8cb91c06b691239ca644f2ec0d15f795996b97d89771882ce0  oem_c13/Marlin/src/module/motion.cpp' | sha256sum -c -
          { echo 'W72_PATCH_APPLIED=PASS'; echo 'W72_SOURCE=434_INTEGRATED'; echo 'W72_NEW_DWIN_FILES=3'; echo 'FLASH_ALLOWED=NO'; echo 'HARDWARE_TESTED=NO'; } | tee evidence/v435/result.txt

      - name: Repair malformed DWIN enum and VP table from v429 (v434 source lock)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/v436
          python3 - <<'PYFIX'
          from pathlib import Path
          import hashlib
          p=Path('oem_c13/Marlin/src/lcd/e3v2/creality/LCD_RTS.h')
          raw=p.read_text()
          original_hash='6bb7341508e45fae23a15b33552b25f9b704875689101ae0e5b47496966af5ab'
          target_hash='a393fb5b684e11a7e658cf52f523720489f0f9b52307c581361549481305d9e4'
          assert hashlib.sha256(raw.encode()).hexdigest()==original_hash, 'Unexpected header; refuse blind edit'
          broken='SelectFileKeyconst unsigned long Addrbuf[] ='
          dangling='};  0x2199,\n  0X2202,\n  0x110E,\n  0\n};'
          assert raw.count(broken)==1 and raw.count(dangling)==1
          raw=raw.replace(broken,'SelectFileKey,\n  SaveEEPROM,\n  ChangePageKey\n};\n\nconst unsigned long Addrbuf[] =')
          raw=raw.replace(dangling,'};')
          assert hashlib.sha256(raw.encode()).hexdigest()==target_hash
          assert raw.count('sv04_dwin_hmi::')==35
          p.write_text(raw)
          print('W73_DWIN_HEADER_REPAIR=PASS')
          PYFIX
          echo 'a393fb5b684e11a7e658cf52f523720489f0f9b52307c581361549481305d9e4  oem_c13/Marlin/src/lcd/e3v2/creality/LCD_RTS.h' | sha256sum -c - | tee evidence/v436/header_sha256.txt
          echo 'W73_REAL434_HEADER_FIXED=PASS' | tee evidence/v436/result.txt

