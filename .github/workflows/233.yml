name: '233 - SV04 NEXT Observer A/B STM32 AUDIT - NO FLASH'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify input hash and unpack
        shell: bash
        run: |
          set -euo pipefail
          echo 'c1d02de232aa88d07925b6eb3120f39962d801fd776783826d82c71d28bf8d1f  SV04_NEXT_233_GITHUB_OBSERVER_AB.zip' | sha256sum -c -
          unzip -tq SV04_NEXT_233_GITHUB_OBSERVER_AB.zip
          mkdir -p work233 evidence233/host
          unzip -q SV04_NEXT_233_GITHUB_OBSERVER_AB.zip -d work233
          unzip -q work233/CLAUDE_194_196_ORIGINAL.zip -d work233/claude
      - name: Observer 232 local host regression
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -pedantic -I work233 work233/test232.cpp -o /tmp/test232
          /tmp/test232 2>&1 | tee evidence233/host/observer232.log
      - name: Claude 194-196 unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s work233/claude/tests -p 'test_*.py' -v 2>&1 | tee evidence233/host/claude_tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sv04next233-host-evidence
          path: evidence233/host/
          if-no-files-found: warn
  stm32:
    name: 'STM32 Claude 194 + Observer=${{ matrix.observer }}'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        observer: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - name: Verify package and extract
        shell: bash
        run: |
          set -euo pipefail
          echo 'c1d02de232aa88d07925b6eb3120f39962d801fd776783826d82c71d28bf8d1f  SV04_NEXT_233_GITHUB_OBSERVER_AB.zip' | sha256sum -c -
          mkdir -p work233 evidence233/stm32
          unzip -q SV04_NEXT_233_GITHUB_OBSERVER_AB.zip -d work233
          unzip -q work233/CLAUDE_194_196_ORIGINAL.zip -d work233/claude
      - name: Clone exact OEM commit
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/Sovol3d/SV04-IDEX-3D-Printer-Mainboard-Source-code.git marlin233
          git -C marlin233 checkout -q --detach 1867fcba75354a5c65e0631d6972dd19f1bd6cbe
          test "$(git -C marlin233 rev-parse HEAD)" = 1867fcba75354a5c65e0631d6972dd19f1bd6cbe
          git -C marlin233 rev-parse HEAD > evidence233/stm32/oem_commit.txt
      - name: Apply Claude original patch then observer 232
        shell: bash
        run: |
          set -euo pipefail
          python3 work233/claude/tools/patch194.py --lcd-oem marlin233/Marlin/src/lcd/e3v2/creality/LCD_RTS.cpp --g29-oem marlin233/Marlin/src/gcode/bedlevel/abl/G29.cpp --out patched233 --report evidence233/stm32/claude_patch.json
          cp -r patched233/Marlin/src/. marlin233/Marlin/src/
          python3 work233/patch232.py marlin233/Marlin/src/lcd/e3v2/creality/LCD_RTS.cpp patched_lcd233.cpp
          cp patched_lcd233.cpp marlin233/Marlin/src/lcd/e3v2/creality/LCD_RTS.cpp
          cp work233/SV04NextMarlinObserver232.hpp work233/SV04NextClaudeHmi231.hpp work233/SV04NextHmiBridge221.hpp work233/SV04NextHmiBridge223.hpp marlin233/Marlin/src/lcd/e3v2/creality/
          git -C marlin233 diff --stat > evidence233/stm32/diffstat.txt
      - name: Force and audit safe compile-time flags
        shell: bash
        env:
          OBSERVER: ${{ matrix.observer }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,json
          o=int(os.environ['OBSERVER']);assert o in (0,1)
          base=pathlib.Path('marlin233/Marlin/src')
          files=[base/'lcd/e3v2/creality/LCD_RTS.cpp',base/'gcode/bedlevel/abl/G29.cpp']
          defines={'SV04NEXT_G29_FAILSAFE_194':0,'SV04NEXT_G29_RESEND_194':0,'SV04NEXT_G29_GUARD_LIVE_194':0}
          if o==1:defines['SV04NEXT_HMI_OBSERVER_232']=1
          else:defines['SV04NEXT_HMI_OBSERVER_232']=0
          prefix=''.join('#define %s %d\n'%(k,v) for k,v in defines.items())
          for p in files:
            s=p.read_text(); assert 'SV04Next_G29' in s or 'SV04NEXT_G29' in s
            p.write_text(prefix+s)
            assert p.read_text().startswith(prefix)
          report={'observer':o,'flags':defines,'files':[str(p) for p in files]}
          pathlib.Path('evidence233/stm32/flags.json').write_text(json.dumps(report,indent=2))
          print(report)
          PY
      - name: Install PlatformIO
        run: python3 -m pip install platformio
      - name: Build selected STM32 variant
        shell: bash
        run: |
          set -o pipefail
          platformio run -d marlin233 -e STM32F103RET6_creality 2>&1 | tee evidence233/stm32/build.log
          test -s marlin233/.pio/build/STM32F103RET6_creality/firmware.elf
          sha256sum marlin233/.pio/build/STM32F103RET6_creality/firmware.elf > evidence233/stm32/elf_sha256.txt
          # Do not publish or flash a firmware binary.
      - name: Upload logs ONLY, never binaries
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sv04next233-stm32-observer-${{ matrix.observer }}-NOT-FOR-INSTALL
          path: evidence233/stm32/
          if-no-files-found: warn
  summary:
    name: 'Combined result'
    runs-on: ubuntu-24.04
    if: always()
    needs: [host, stm32]
    steps:
      - name: Report results
        env:
          HOST: ${{ needs.host.result }}
          STM32: ${{ needs.stm32.result }}
        run: |
          mkdir -p summary233
          printf 'HOST=%s\nSTM32_MATRIX=%s\nNO_FLASH=TRUE\nNO_BINARIES_PUBLISHED=TRUE\n' "$HOST" "$STM32" > summary233/RESULT_233.txt
          cat summary233/RESULT_233.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sv04next233-GESAMTBERICHT
          path: summary233/
      - name: Verify
        env:
          HOST: ${{ needs.host.result }}
          STM32: ${{ needs.stm32.result }}
        run: test "$HOST" = success && test "$STM32" = success
