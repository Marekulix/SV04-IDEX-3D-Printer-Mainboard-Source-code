name: '1'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build1:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Sovol Marlin original
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tested sources restore
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_BUNDLED'
          import base64,gzip,pathlib,hashlib
          files={
            'include/SV04Next20PhaseContract.hpp': '',
            'include/SV04NextAuto60Orchestrator.hpp': '',
            'include/SV04NextAuto60Safety.hpp': '',
            'include/SV04NextDwinView.hpp': '',
            'include/SV04NextG29UDisplayFrame.hpp': '',
            'include/SV04NextG29UReceipt.hpp': '',
            'include/SV04NextMeshJournal.hpp': '',
            'include/SV04NextNativeReadiness.hpp': '',
            'include/SV04NextNativeThermalGate.hpp': '',
            'include/SV04NextRtsTelemetry.hpp': '',
            'include/SV04NextSequencedController.hpp': '',
            'include/SV04NextVisitProof.hpp': '',
            'integration/apply_native_guard_v2.py': '',
            'integration/apply_native_guard_v3.py': '',
            'integration/apply_native_guard_v4.py': '',
            'integration/apply_native_guard_v5.py': '',
            'integration/apply_native_guard_v6.py': '',
            'integration/apply_native_guard_v7.py': '',
            'integration/apply_native_guard_v8.py': '',
            'tests/run_all_local.sh': '',
            'tests/test_20_phase_contract.cpp': '',
            'tests/test_auto60_safety.cpp': '',
            'tests/test_faultmatrix.cpp': '',
            'tests/test_g29_transaction_model.cpp': '',
            'tests/test_g29u_display_frame.cpp': '',
            'tests/test_g29u_receipt.cpp': '',
            'tests/test_journal.cpp': '',
            'tests/test_native_readiness.cpp': '',
            'tests/test_native_thermal_gate.cpp': '',
            'tests/test_native_thermal_runtime.cpp': '',
            'tests/test_orchestrator.cpp': '',
            'tests/test_overlay_v2.py': '',
            'tests/test_overlay_v3.py': '',
            'tests/test_overlay_v4.py': '',
            'tests/test_overlay_v5.py': '',
            'tests/test_overlay_v6.py': '',
            'tests/test_overlay_v7.py': '',
            'tests/test_overlay_v8.py': '',
            'tests/test_rts_rollback_map.py': '',
            'tests/test_rts_telemetry.cpp': '',
            'tests/test_sequenced_controller.cpp': '',
            'tests/test_visit_proof.cpp': '',
          }
          for name,payload in files.items():
              dest=pathlib.Path(name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(gzip.decompress(base64.b64decode(payload)))
              print(name,hashlib.sha256(dest.read_bytes()).hexdigest())
          PY_BUNDLED
      - name: Host safety regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          bash tests/run_all_local.sh 2>&1 | tee evidence/all-local-tests.log
      - name: Native source SHA guarded overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 integration/apply_native_guard_v8.py --root . \
            --thermal-header include/SV04NextNativeThermalGate.hpp \
            --visit-header include/SV04NextVisitProof.hpp \
            --receipt-header include/SV04NextG29UReceipt.hpp \
            --native-header include/SV04NextNativeReadiness.hpp \
            --evidence evidence/overlay.json 2>&1 | tee evidence/patch.log
          git diff --exit-code -- Marlin/Configuration.h Marlin/src/module/probe.cpp
          git diff --check
          git status --short > evidence/source_changes.txt
      - name: PlatformIO
        shell: bash
        run: |
          python3 -m pip install platformio==6.1.18
      - name: Native STM32 firmware compile test only
        shell: bash
        run: |
          set -euo pipefail
          pio run -e STM32F103RET6_creality 2>&1 | tee compile.log
          python3 - <<'PY_OK'
          import json,pathlib
          p=pathlib.Path('evidence/build-proof.json')
          p.parent.mkdir(exist_ok=True)
          p.write_text(json.dumps({'status':'SUCCESS','native_stm32_compile':True,'hardware_tested':False,'flash_approved':False,
            'physical_t1_verified':False,'eeprom_auto_save':False,'new_dwin_button':False},indent=2)+'\n')
          PY_OK
      - name: Evidence not firmware
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          echo 'EXPERIMENT ONLY. DO NOT FLASH. NO PHYSICAL T1 PARK PROOF. NO NEW TOUCH BUTTON OR EEPROM AUTO-SAVE.' > evidence/NICHT_FLASHEN.txt
          git rev-parse HEAD > evidence/oem_commit.txt
          git status --short > evidence/source_changes.txt
          if test -f compile.log; then cp compile.log evidence/compile.log; fi
          if test -f .pio/build/STM32F103RET6_creality/firmware.bin; then
            sha256sum .pio/build/STM32F103RET6_creality/firmware.bin > evidence/firmware-sha256-only.txt
            wc -c < .pio/build/STM32F103RET6_creality/firmware.bin > evidence/firmware-size-only.txt
          fi
      - name: '1'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: '1'
          path: evidence/
          if-no-files-found: error
