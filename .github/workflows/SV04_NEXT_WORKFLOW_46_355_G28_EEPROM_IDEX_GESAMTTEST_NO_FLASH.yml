        shell: bash
        run: |
          set +e
          unset PLATFORMIO_BUILD_FLAGS
          mkdir -p export/src export/pre
          for pat in settings.cpp settings.h crc16.cpp crc16.h 'M500-M504.cpp' 'eeprom*.cpp' 'eeprom*.h' 'persistent_store*' 'serial.h' 'macros.h' 'MarlinConfig.h' powerloss.cpp powerloss.h; do
            find oem_c13/Marlin/src -name "$pat" -print | while read -r f; do mkdir -p "export/src/$(dirname "${f#oem_c13/}")"; cp "$f" "export/src/${f#oem_c13/}"; done
          done
          cp oem_c13/Marlin/Configuration.h oem_c13/Marlin/Configuration_adv.h export/src/ 2>/dev/null
          cp evidence/eeprom_macros_real.txt evidence/serial_macros_real.txt export/ 2>/dev/null
          /tmp/sv04_pio_309/bin/pio run -d oem_c13 -e STM32F103RET6_creality -t compiledb > export/pre/compiledb.log 2>&1
          python3 - <<'PYX' > export/pre/LOG.txt 2>&1
          import json, re, shlex, subprocess, os, glob
          root = os.path.abspath('oem_c13'); outdir = os.path.abspath('export/pre')
          db = glob.glob('oem_c13/compile_commands.json') + glob.glob('oem_c13/.pio/build/*/compile_commands.json')
          print('compile_commands:', db)
          want = ('settings.cpp', 'crc16.cpp', 'M500-M504.cpp', 'eeprom_flash.cpp', 'eeprom_wired.cpp', 'eeprom_bl24cxx.cpp', 'eeprom_if.cpp')
          if db:
              for e in json.load(open(db[0])):
                  d = e.get('directory') or root
                  f = os.path.normpath(os.path.join(d, e['file']))
                  if os.path.basename(f) not in want: continue
                  a = shlex.split(e.get('command') or ' '.join(e['arguments'])); out = []; i = 0
                  while i < len(a):
                      if a[i] == '-o': i += 2; continue
                      if a[i] == '-c': i += 1; continue
                      out.append(a[i]); i += 1
                  rel = os.path.relpath(f, root) if f.startswith(root) else f
                  base = re.sub(r'[^A-Za-z0-9_.]+', '_', rel).strip('_')
                  for flag, suf in (('-E', '.i'), ('-E -dM', '.macros')):
                      r = subprocess.run(out + flag.split() + ['-o', os.path.join(outdir, base + suf)], capture_output=True, text=True, cwd=d)
                      print(base, flag, 'rc=%d' % r.returncode, r.stderr[:300].replace('\n', ' '))
          PYX
          (cd export && find . -type f ! -name SHA256SUMS.txt | sort | xargs sha256sum > SHA256SUMS.txt)
          du -sh export; cat export/pre/LOG.txt | head -20
      - name: 328B full-chain host test on the REAL preprocessed 328B tree (executes real save/load/validate/report/reset, negative cases, mutants) + crc16 equivalence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence/fullchain328b
          rc=0
          # AP1: Export vollstaendig und aktives Backend aus echter Konfiguration
          for f in Marlin_src_module_settings.cpp Marlin_src_HAL_STM32_eeprom_bl24cxx.cpp Marlin_src_gcode_eeprom_M500_M504.cpp Marlin_src_libs_crc16.cpp; do
            for e in i macros; do test -s "export/pre/$f.$e" && echo "OK   export/pre/$f.$e" || { echo "FEHLT export/pre/$f.$e"; rc=1; }; done
          done > evidence/fullchain328b/ap1_export_check.txt 2>&1
          cat evidence/fullchain328b/ap1_export_check.txt
          if grep -q '^FEHLT' evidence/fullchain328b/ap1_export_check.txt; then rc=1; fi
          grep -c . export/pre/LOG.txt >/dev/null && cp export/pre/LOG.txt evidence/fullchain328b/export_LOG.txt
          grep -E '^#define (IIC_BL24CXX_EEPROM|FLASH_EEPROM_EMULATION|EEPROM_OFFSET|EEPROM_VERSION|MARLIN_EEPROM_SIZE)\b' export/pre/Marlin_src_module_settings.cpp.macros | tee evidence/fullchain328b/ap1_backend_macros.txt
          grep -q 'IIC_BL24CXX_EEPROM' evidence/fullchain328b/ap1_backend_macros.txt || { echo 'FAIL: aktives Backend nicht IIC_BL24CXX_EEPROM'; rc=1; }
          # 328B im echten .i vorhanden?
          grep -c 'if (!eeprom_error) do{ serial_echo_start(); do{ serial_echopair_PGM(("Settings Stored (")' export/pre/Marlin_src_module_settings.cpp.i | tee evidence/fullchain328b/ap_328b_in_real_i.txt
          # Vollkette
          python3 -I t328b/test_328b.py export/pre evidence/fullchain328b/lauf --real328b 2>&1 | tee evidence/fullchain328b/test_328b_stdout.txt
          [ "${PIPESTATUS[0]}" -eq 0 ] || rc=1
          # crc16-Aequivalenz (echtes libs/crc16.cpp gegen nachgebautes Modell)
          python3 -I t328b/check_crc16.py export/pre/Marlin_src_libs_crc16.cpp.i evidence/fullchain328b/crc16 2>&1 | tee evidence/fullchain328b/crc16_equiv.txt
          [ "${PIPESTATUS[0]}" -eq 0 ] || rc=1
          echo "FULLCHAIN328B_RC=$rc FLASH_ALLOWED=NO HARDWARE_TESTED=NO" | tee evidence/fullchain328b/result.txt
          exit "$rc"

