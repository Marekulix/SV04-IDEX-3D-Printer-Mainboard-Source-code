name: 105 - SV04 NEXT DWIN Source Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dwin-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user repository
        uses: actions/checkout@v4
      - name: Install image and testing dependencies
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Unpack exact project 105
        shell: bash
        run: |
          set -euo pipefail
          test -f SV04_NEXT_105.zip
          mkdir -p sv04-next105
          unzip -q SV04_NEXT_105.zip -d sv04-next105
          test -f sv04-next105/tools/build105.py
          sha256sum SV04_NEXT_105.zip | tee sv04-next105/input_sha256.txt
      - name: Execute local object and source tests
        shell: bash
        run: |
          mkdir -p evidence
          set -o pipefail
          python -m unittest discover -s sv04-next105/tests -p 'test*.py' -v 2>&1 | tee evidence/tests.log
      - name: Fetch public SV04 DGUS project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git clone --depth 1 https://github.com/bphillips09/SV04-Touchscreen.git sv04-oem-dgus 2>&1 | tee evidence/clone.log
          git -C sv04-oem-dgus rev-parse HEAD | tee evidence/source_commit.txt
      - name: Assemble editor project and audit unchanged binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python sv04-next105/tools/build105.py --source sv04-oem-dgus --out dgus-output 2>&1 | tee evidence/assembly.log
          cp dgus-output/AUDIT_105.json evidence/
          cp dgus-output/EDITIERANLEITUNG_105.md evidence/
          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('dgus-output/AUDIT_105.json').read_text())
          assert audit['status']=='SOURCE_ASSEMBLY_ONLY_NOT_DGUS_COMPILED'
          assert not audit['new_binaries_compiled']
          assert audit['uncompiled_objects']==18
          print('DGUS SOURCE ASSEMBLY SUCCESS. NO DGUS COMPILED FIRMWARE.')
          PY
      - name: Package source for DGUS editor (NOT flash-ready)
        shell: bash
        run: |
          if [ -d dgus-output/SV04_DGUS_EDITOR_SOURCE ]; then
            cd dgus-output
            zip -q -r ../SV04_NEXT_105_DGUS_EDITOR_SOURCE_NOT_FLASH_READY.zip SV04_DGUS_EDITOR_SOURCE EDITIERANLEITUNG_105.md AUDIT_105.json
          fi
      - name: Upload audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sv04next105-dwin-audit
          path: |
            evidence/
            sv04-next105/input_sha256.txt
            dgus-output/AUDIT_105.json
          if-no-files-found: warn
      - name: Upload DGUS editable source only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sv04next105-dwin-source
          path: SV04_NEXT_105_DGUS_EDITOR_SOURCE_NOT_FLASH_READY.zip
          if-no-files-found: warn
