      - name: Check actual Marlin tree and install PlatformIO
        shell: bash
        run: |
          set -euo pipefail
          test -s oem_c13/platformio.ini
          test -s oem_c13/Marlin/src/gcode/calibrate/G28.cpp
          python3 -m pip install --user platformio==6.1.18
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Apply audited 470 overlay only in checked-out workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          for f in Marlin/src/gcode/calibrate/G28.cpp Marlin/src/module/motion.cpp Marlin/src/lcd/e3v2/creality/LCD_RTS.cpp Marlin/src/lcd/e3v2/creality/LCD_RTS.h; do
            test -s "oem_c13/$f"
            cp "/tmp/sv04_472_payload/$f" "oem_c13/$f"
          done
          cd oem_c13
          sha256sum Marlin/src/gcode/calibrate/G28.cpp Marlin/src/module/motion.cpp Marlin/src/lcd/e3v2/creality/LCD_RTS.cpp Marlin/src/lcd/e3v2/creality/LCD_RTS.h > ../evidence/installed_sources.sha256
          printf 'FLASH_ALLOWED=NO\nHARDWARE_TESTED=NO\nG28_OK=NO\n' > ../evidence/STATUS.txt
      - name: Run 470 native extracted tests
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror /tmp/sv04_472_payload/tests/native470_extracted.cpp -o /tmp/sv04_472_native
          /tmp/sv04_472_native | tee evidence/native.log
      - name: STM32 full PlatformIO build
        shell: bash
        run: |
          set -euo pipefail
          pio run -d oem_c13 -e STM32F103RET6_creality 2>&1 | tee evidence/stm32.log
          test -s oem_c13/.pio/build/STM32F103RET6_creality/firmware.bin
          cp oem_c13/.pio/build/STM32F103RET6_creality/firmware.bin evidence/SV04_472_BUILD_CANDIDATE_NOT_APPROVED_FOR_FLASH.bin
          sha256sum evidence/SV04_472_BUILD_CANDIDATE_NOT_APPROVED_FOR_FLASH.bin > evidence/firmware.sha256
      - name: Publish diagnostics (including failed runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV04_NEXT_472_DIAGNOSTICS_NO_FLASH
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
