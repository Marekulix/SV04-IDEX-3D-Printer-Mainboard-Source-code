# SV04 NEXT Phase 10.27; HOST-ONLY; no 3D printer hardware access.
# Independent safety state-machine tests. No firmware binary is created.
name: SV04 NEXT 10.27 Auto60 Host Safety - NICHT FLASHEN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto60-host-safety:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Read-only OEM Marlin checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard OEM sources and baseline configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          sha256sum Marlin/Configuration.h platformio.ini | tee evidence/CONFIG_SHA256.txt
          test "$(sha256sum Marlin/Configuration.h | cut -d' ' -f1)" = "c9a5bffe15df624d33a6cad03661955d1a11d291c8f1ad45966fa913a987c665"
          test "$(sha256sum platformio.ini | cut -d' ' -f1)" = "9c2938dee97e41cd76919628ba74588e91b3313eecb3626df50e1cddd229f02c"
          test "$(git hash-object Marlin/src/gcode/bedlevel/abl/G29.cpp)" = "02df6e4c8d017cf4dd1d4c9e6986a8967a317a8b"
          test "$(git hash-object Marlin/src/lcd/e3v2/creality/LCD_RTS.cpp)" = "2a63c281c8d8861e9780997df60e82becaa02805"
          printf 'Original OEM code matches checked baseline.\n' | tee evidence/OEM_GUARDS.txt

      - name: Build host-only safety sources from verified payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PAYLOAD'
          import base64, gzip, hashlib, pathlib
          payloads = {
              'include/SV04NextAuto60Safety.hpp': '',
              'tests/test_auto60_safety.cpp': '',
          }
          expected = {'include/SV04NextAuto60Safety.hpp': 'cd6bdc5581941bbb685e20cf783db8511d16ff08a7cf23b67af4493d29830bc3', 'tests/test_auto60_safety.cpp': 'f87a500cd59c11b5734850df9b5e9f8dde3695a657e92a44cdc4a2096d2eef21'}
          for name, encoded in payloads.items():
              data = gzip.decompress(base64.b64decode(encoded, validate=True))
              digest = hashlib.sha256(data).hexdigest()
              if digest != expected[name]:
                  raise RuntimeError('Payload checksum mismatch: ' + name)
              path = pathlib.Path('sv04-next-phase1027') / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              print(name, digest)
          PY_PAYLOAD

      - name: Host C++11 debug, sanitizer and optimized tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          SRC=sv04-next-phase1027/tests/test_auto60_safety.cpp
          g++ -std=c++11 -O0 -Wall -Wextra -Werror -pedantic "$SRC" -o /tmp/sv04-safe-debug
          /tmp/sv04-safe-debug | tee evidence/debug.log
          g++ -std=c++11 -O0 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer "$SRC" -o /tmp/sv04-safe-sanitized
          /tmp/sv04-safe-sanitized | tee evidence/sanitizers.log
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -pedantic "$SRC" -o /tmp/sv04-safe-optimized
          /tmp/sv04-safe-optimized | tee evidence/optimized.log
          sha256sum sv04-next-phase1027/include/SV04NextAuto60Safety.hpp sv04-next-phase1027/tests/test_auto60_safety.cpp > evidence/SOURCES_SHA256.txt
          git status --porcelain > evidence/GIT_STATUS.txt
          printf 'HOST-ONLY; M190/G28/G29/M500 not executed; no firmware.bin; NICHT FLASHEN\n' > evidence/NICHT_FLASHEN.txt

      - name: Archive evidence (never firmware)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV04-NEXT-10-27-HOST-SAFETY-NICHT-FLASHEN
          path: evidence/
          if-no-files-found: warn
