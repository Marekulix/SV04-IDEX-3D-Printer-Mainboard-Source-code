          echo "bfb495f94ee837864c92ad56dd46fb1532cbc5f5da3804a49045ca5ff0d1ce2e  $F11" | sha256sum -c - | tee evidence/input_c11_sha.txt
          unzip -t "$F11" > evidence/zip_c11_integrity.txt
