name: "SV04 328A EEPROM SETTINGS FIELDS (B1 load check, B2 order, B3 report) on 325 - SV04 325 M420 FAILCLOSED - DWIN322 5-PUNKTE AUDIT - DWIN321 integration - C13 + DWIN319 INTEGRATION27 - FIX26 WORKFLOW25 - IDEX gap guard, no motion before homing, fans on at kill on C12 on C11 on C10 on C9 on 318 (route B, STRICT installer), baseline C12 vs C13 copy, STM32 NO FLASH, binaries exported, evaluated (number-free)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline_c12:
    name: "Baseline build: NEW C12 copy (318 + C9 + C10 + C11 + C12), both profiles"
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout input files
        uses: actions/checkout@v4
      - name: Verify inputs (resolved by prefix and SHA-256 - 318 hand-over, Claude C9, C10, C11, C12)
        shell: bash
        run: |
          set -euo pipefail
          resolve() {
            # Android haengt bei Mehrfach-Uploads " (1)" an. Datei wird ueber Namenspraefix UND SHA-256 gefunden, nie ueber den exakten Namen.
            local prefix="$1" hash="$2" f
            shopt -s nullglob
            for f in "$prefix"*.zip; do
              if [ "$(sha256sum -- "$f" | cut -d' ' -f1)" = "$hash" ]; then printf '%s' "$f"; return 0; fi
            done
            echo "FEHLT: keine Datei '$prefix*.zip' mit sha256 $hash im Repository-Stamm" >&2; ls -la >&2; return 1
          }
          mkdir -p evidence c318 c9pkg c10pkg c11pkg c12pkg
          F318="$(resolve SV04_NEXT_318_GITHUB_UPLOAD_06 b474d80ac3d67a8f5f4f81d8a9c0e7fa1d24996c738b2e6b7001aefce15a18dd)"
          echo "F318=$F318" | tee -a evidence/input_names.txt
          echo "b474d80ac3d67a8f5f4f81d8a9c0e7fa1d24996c738b2e6b7001aefce15a18dd  $F318" | sha256sum -c - | tee evidence/input_318_sha.txt
          unzip -t "$F318" > evidence/zip_318_integrity.txt
          unzip -q "$F318" -d c318
          F9="$(resolve SV04_NEXT_CLAUDE_C9_IDEX_BLTOUCH_G28_ABSCHLUSS d7af0fa681d03112defd3b58618d3eef573ccc72d2d29a7efb7e5431e638a5eb)"
          echo "F9=$F9" | tee -a evidence/input_names.txt
          echo "d7af0fa681d03112defd3b58618d3eef573ccc72d2d29a7efb7e5431e638a5eb  $F9" | sha256sum -c - | tee evidence/input_c9_sha.txt
          unzip -t "$F9" > evidence/zip_c9_integrity.txt
          unzip -q "$F9" -d c9pkg
          F10="$(resolve SV04_NEXT_CLAUDE_C10_STOPP_GATE_QUEUE b422e97e45bec791fe0a60c0d9bf7b27eec2432e01c9b32bcec492ae05638c6e)"
          echo "F10=$F10" | tee -a evidence/input_names.txt
          echo "b422e97e45bec791fe0a60c0d9bf7b27eec2432e01c9b32bcec492ae05638c6e  $F10" | sha256sum -c - | tee evidence/input_c10_sha.txt
          unzip -t "$F10" > evidence/zip_c10_integrity.txt
          unzip -q "$F10" -d c10pkg
          F11="$(resolve SV04_NEXT_CLAUDE_C11_SD_HOMEAXIS_FAN_SAFETY bfb495f94ee837864c92ad56dd46fb1532cbc5f5da3804a49045ca5ff0d1ce2e)"
          echo "F11=$F11" | tee -a evidence/input_names.txt
          echo "bfb495f94ee837864c92ad56dd46fb1532cbc5f5da3804a49045ca5ff0d1ce2e  $F11" | sha256sum -c - | tee evidence/input_c11_sha.txt
          unzip -t "$F11" > evidence/zip_c11_integrity.txt
          unzip -q "$F11" -d c11pkg
          F12="$(resolve SV04_NEXT_CLAUDE_C12_HOMEAXIS_FAN_STOP ab2209676008532b4985fa20063a1115724bb09aeaab9cd378078341d214cbf5)"
          echo "F12=$F12" | tee -a evidence/input_names.txt
          echo "ab2209676008532b4985fa20063a1115724bb09aeaab9cd378078341d214cbf5  $F12" | sha256sum -c - | tee evidence/input_c12_sha.txt
          unzip -t "$F12" > evidence/zip_c12_integrity.txt
          unzip -q "$F12" -d c12pkg
          (cd c318 && python3 - <<'PYV'
          import json, hashlib, pathlib
          m = json.load(open('SHA256_MANIFEST_318.json')); items = m if isinstance(m, list) else m.get('files', m)
          if isinstance(items, dict): items = [{'path': k, 'sha256': v if isinstance(v, str) else v.get('sha256')} for k, v in items.items()]
          bad = [i for i in items if pathlib.Path(i.get('path') or i.get('file')).is_file() and hashlib.sha256(pathlib.Path(i.get('path') or i.get('file')).read_bytes()).hexdigest() != i.get('sha256')]
          print('MANIFEST_318 geprueft', len(items), 'abweichend', len(bad)); assert not bad
          PYV
          ) | tee evidence/manifest_318.txt

      - name: Checkout pinned OEM firmware (not user GitHub branch)
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/Sovol3d/SV04-IDEX-3D-Printer-Mainboard-Source-code.git oem
          git -C oem checkout -q --detach 1867fcba75354a5c65e0631d6972dd19f1bd6cbe
          test "$(git -C oem rev-parse HEAD)" = '1867fcba75354a5c65e0631d6972dd19f1bd6cbe'
          git -C oem rev-parse HEAD | tee evidence/oem_pin.txt
      - name: Reproduce 309 from the recorded combined_308.patch (ROUTE B - without the 287 package; a DIFFERENT route than the original 309 build)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          echo 'caaa7ccf7d9263fa74b383f726428c3fc463e825b27617b999dd68cfc7c251cc  c318/combined_308.patch' | sha256sum -c - | tee evidence/combined_308_sha.txt
          test -z "$(git -C oem status --porcelain)"
          git -C oem apply --check --whitespace=nowarn ../c318/combined_308.patch
          git -C oem apply --whitespace=nowarn ../c318/combined_308.patch
          git -C oem status --porcelain | tee evidence/route_b_status.txt
          test "$(git -C oem status --porcelain | wc -l)" -eq 15
          sha256sum -c - <<'ROUTE_B_PINS' | tee evidence/route_b_309_pins.txt
          4f1698bc3b16052d9855b0504ef7728c41bc127a0da551fc77efcb6c8f58c93d  oem/Marlin/src/module/tool_change.cpp
          54ff1c0c034f76b1c795e747cbc0fad525c259c6ce6ffd0e8c7fd4c90062ec96  oem/Marlin/src/module/motion.cpp
          c1b44b74784eaaa45da8c13d1765a2094a3823c45912fc7200e3873924c1de24  oem/Marlin/src/gcode/bedlevel/abl/G29.cpp
          faf2d034a067ccecea5e0d413028e9598935fe577486748a6a5493bc16c6a097  oem/Marlin/src/feature/sv04_claude_auto60/sv04_claude_auto60_core.h
          379848c3a0e3cd2f2a67e4f560b0a02592b6d95bd414818d8d4fc8ad0f04a2a3  oem/Marlin/src/feature/sv04_claude_auto60/sv04_claude_eeprom_core.h
          d616c3e94826ffaac50e5e43fa842a53f17a091ff24537433edc8ce1c8afa250  oem/Marlin/src/feature/sv04_claude_auto60/sv04_claude_g29_session.h
          a6ea813001b6a81547c17834811aba68bc6022a526e19145643be2bfe445b16d  oem/Marlin/src/feature/sv04_claude_auto60/sv04_claude_toolchange_policy.h
          b417b83080615d869ffd3b5115a057b10d4ce50187cfc12de3e8649888cad06d  oem/Marlin/src/gcode/control/sv04_claude_toolchange_guard.h
          03543e739c3fe75d668f57202441597a3a5050b62ffaa25c2f8ca45573db4f1f  oem/Marlin/src/lcd/e3v2/creality/sv04_claude_auto60_marlin.inc
          7ca925326ca62b286c529c2ef2f722cb0899b6319c1f47aece5fb2f9d0b484aa  oem/Marlin/src/lcd/e3v2/creality/sv04_claude_hooks.h
          f7cf74f644d473927e13478d2f851d24c9b77f29c7c7f9b628f48809186a3b0b  oem/Marlin/src/lcd/e3v2/creality/sv04_claude_oem_mesh_loop.inc
          ROUTE_B_PINS
      - name: Install PlatformIO 6.1.18
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/sv04_pio_309
          /tmp/sv04_pio_309/bin/pip install 'platformio==6.1.18' > evidence/pio_install_308.txt 2>&1
          /tmp/sv04_pio_309/bin/pio --version | tee evidence/pio_version.txt
      - name: Apply 318 installer to a NEW copy through the STRICT wrapper (309 stays untouched, fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          sha256sum oem/Marlin/src/module/tool_change.cpp oem/Marlin/src/module/motion.cpp oem/Marlin/src/gcode/bedlevel/abl/G29.cpp | tee evidence/source_hashes_309_before_318.txt
          python3 c9pkg/02_PATCHES/integrate_318_strict.py c318 oem oem318 2>&1 | tee evidence/integrate_318_strict.txt
          grep -F 'STRICT_PRECHECK=OK' evidence/integrate_318_strict.txt
          grep -F '318 SOURCE OVERLAY APPLIED' evidence/integrate_318_strict.txt
          diff -rq oem oem318 2>&1 | grep -v '^Only in .*\.git' | tee evidence/diff_309_vs_318.txt || true
          for f in Marlin/src/module/tool_change.cpp Marlin/src/module/motion.cpp Marlin/src/gcode/bedlevel/abl/G29.cpp Marlin/src/feature/sv04_claude_auto60/sv04_claude_auto60_core.h Marlin/src/lcd/e3v2/creality/sv04_claude_auto60_marlin.inc Marlin/src/feature/sv04_claude_auto60/sv04_claude_zhome_policy.h; do sha256sum "oem318/$f"; done | tee evidence/source_hashes_318.txt
          # the unmodified 309 tree must be byte-identical after the installer ran
          sha256sum oem/Marlin/src/module/tool_change.cpp oem/Marlin/src/module/motion.cpp oem/Marlin/src/gcode/bedlevel/abl/G29.cpp | diff - evidence/source_hashes_309_before_318.txt
      - name: Apply C9 patch to a NEW copy of 318 (318 stays untouched, fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          cp -a oem318 oem_c9
          python3 c9pkg/02_PATCHES/apply_m999_reset_c9.py oem_c9 2>&1 | tee evidence/apply_m999_reset_c9.txt
          grep -F "M999_C9=PATCHED" evidence/apply_m999_reset_c9.txt
          diff -rq oem318 oem_c9 2>&1 | tee evidence/diff_318_vs_c9.txt || true
          test "$(diff -rq oem318 oem_c9 | wc -l)" -eq 1
          grep -F "M999.cpp" evidence/diff_318_vs_c9.txt
          echo "f778002d1a491dc58ee4d8c550120f24db477ec185d3f7124acc457968659cb9  oem318/Marlin/src/gcode/control/M999.cpp" | sha256sum -c - | tee evidence/oem318_m999_unchanged.txt
          sha256sum oem_c9/Marlin/src/gcode/control/M999.cpp | tee evidence/source_hash_c9_m999.txt
      - name: Apply C10 patch to a NEW copy of C9 (318 and C9 stay untouched, fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          cp -a oem_c9 oem_c10
          python3 c10pkg/02_PATCHES/apply_c10.py oem_c10 2>&1 | tee evidence/apply_c10.txt
          grep -F "gcode.cpp: PATCHED" evidence/apply_c10.txt
          grep -F "queue.cpp: PATCHED" evidence/apply_c10.txt
          grep -F "M999.cpp: PATCHED" evidence/apply_c10.txt
          diff -rq oem_c9 oem_c10 2>&1 | tee evidence/diff_c9_vs_c10.txt || true
          test "$(diff -rq oem_c9 oem_c10 | wc -l)" -eq 4
          grep -F "gcode/gcode.cpp" evidence/diff_c9_vs_c10.txt
          grep -F "gcode/queue.cpp" evidence/diff_c9_vs_c10.txt
          grep -F "control/M999.cpp" evidence/diff_c9_vs_c10.txt
          grep -F "sv04_claude_stopgate.h" evidence/diff_c9_vs_c10.txt
          echo "cbaca8b8bca033002a39ceb0eff7a7a64799a2c99e7d1f83cb5ea6a203418654  oem_c9/Marlin/src/gcode/control/M999.cpp" | sha256sum -c - | tee evidence/oem_c9_m999_unchanged.txt
          sha256sum oem_c10/Marlin/src/gcode/gcode.cpp oem_c10/Marlin/src/gcode/queue.cpp oem_c10/Marlin/src/gcode/control/M999.cpp oem_c10/Marlin/src/gcode/sv04_claude_stopgate.h | tee evidence/source_hashes_c10.txt
      - name: Apply C11 patch to a NEW copy of C10 (C9/C10 trees stay untouched, fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          cp -a oem_c10 oem_c11
          python3 c11pkg/02_PATCHES/apply_c11.py oem_c11 2>&1 | tee evidence/apply_c11.txt
          grep -F "queue.cpp: PATCHED" evidence/apply_c11.txt
          grep -F "M999.cpp: PATCHED" evidence/apply_c11.txt
          grep -F "MarlinCore.cpp: PATCHED" evidence/apply_c11.txt
          diff -rq oem_c10 oem_c11 2>&1 | tee evidence/diff_c10_vs_c11.txt || true
          test "$(diff -rq oem_c10 oem_c11 | wc -l)" -eq 3
          grep -F "gcode/queue.cpp" evidence/diff_c10_vs_c11.txt
          grep -F "control/M999.cpp" evidence/diff_c10_vs_c11.txt
          grep -F "src/MarlinCore.cpp" evidence/diff_c10_vs_c11.txt
          sha256sum oem_c11/Marlin/src/gcode/queue.cpp oem_c11/Marlin/src/gcode/control/M999.cpp oem_c11/Marlin/src/MarlinCore.cpp | tee evidence/source_hashes_c11.txt
      - name: Run Claude C11 host tests and C10 regression (no network, no hardware)
        shell: bash
        run: |
          set -euo pipefail
          (cd c11pkg/03_TESTS && python3 -B test_c11.py) 2>&1 | tee evidence/c11_host_tests.txt
          grep -qx 'OK' evidence/c11_host_tests.txt
          (cd c11pkg/03_TESTS && python3 -B test_c11_homeaxis_anker.py) 2>&1 | tee evidence/c11_homeaxis_anker.txt
          grep -qx 'OK' evidence/c11_homeaxis_anker.txt
          (cd c11pkg/03_TESTS/regression_c10/03_TESTS && python3 -B test_c10.py) 2>&1 | tee evidence/c10_regression_in_c11.txt
          grep -qx 'OK' evidence/c10_regression_in_c11.txt
      - name: Apply C12 patch to a NEW copy of C11 (C11 tree stays untouched, fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          cp -a oem_c11 oem_c12
          python3 c12pkg/02_PATCHES/apply_c12.py oem_c12 2>&1 | tee evidence/apply_c12.txt
          grep -F "sv04_claude_stopgate.h: PATCHED" evidence/apply_c12.txt
          diff -rq oem_c11 oem_c12 2>&1 | tee evidence/diff_c11_vs_c12.txt || true
          test "$(diff -rq oem_c11 oem_c12 | wc -l)" -eq 1
          grep -F "sv04_claude_stopgate.h" evidence/diff_c11_vs_c12.txt
          sha256sum oem_c12/Marlin/src/gcode/sv04_claude_stopgate.h | tee evidence/source_hash_c12_stopgate.txt
          grep -F "7ead4e640f70f1c9796d5cb3085f7f758a40ab63ce127fc1c4623d09cef9f29c" evidence/source_hash_c12_stopgate.txt
      - name: Run Claude C12 host tests (fan gate, real homeaxis harness; no network, no hardware)
        shell: bash
        run: |
          set -euo pipefail
          (cd c12pkg/03_TESTS && python3 -B test_c12_fan.py) 2>&1 | tee evidence/c12_fan_tests.txt
          grep -qx 'OK' evidence/c12_fan_tests.txt
          (cd c12pkg/03_TESTS && python3 -B test_c12_homeaxis.py) 2>&1 | tee evidence/c12_homeaxis_tests.txt
          grep -qx 'OK' evidence/c12_homeaxis_tests.txt
      - name: Build STM32 profiles independently, framework-first, NO FLASH
        shell: bash
        run: |
          # NEVER call `pio run -t clean` before framework is installed.
          # On a virgin runner this invokes generic_create_variant.py before
          # framework-arduinoststm32 exists (verified failure in GitHub 308).
          # A standard first `pio run` installs framework BEFORE pre scripts;
          # this sequence is proven by BOTH successful 291 STM32 build logs.
          set +e
          fail=0
          for profile in integrated_backend integrated_failclosed; do
            mkdir -p "evidence/c12_base/$profile"
            # Invalidate generated object files, NOT package/toolchain caches.
            # This prevents accidentally reusing backend objects in failclosed.
            rm -rf oem_c12/.pio/build/STM32F103RET6_creality
            if [ "$profile" = integrated_failclosed ]; then
              export PLATFORMIO_BUILD_FLAGS='-DSV04_CLAUDE_HOME_BACKEND_AVAILABLE=0'
            else
              export PLATFORMIO_BUILD_FLAGS=''
            fi
            /tmp/sv04_pio_309/bin/pio run -d oem_c12 -e STM32F103RET6_creality > "evidence/c12_base/$profile/build.log" 2>&1
            build_rc=$?
            # Exit 0 alone is not accepted without the PIO SUCCESS marker.
            if [ "$build_rc" -eq 0 ] && ! grep -Fq '[SUCCESS]' "evidence/c12_base/$profile/build.log"; then
              echo 'FAIL: PIO exit 0 without a build SUCCESS marker' >> "evidence/c12_base/$profile/build.log"
              build_rc=42
            fi
            {
              echo "BUILD_TREE=oem_c12"
              echo "PROFILE=$profile"
              echo 'BUILD_STRATEGY=FRAMEWORK_FIRST_DIRECT_PIO_RUN'
              echo 'SOURCE_BASE=ROUTE_B_C12_ON_C11_ON_C10_ON_C9_ON_318_NEW_COPY'
              echo "BUILD_EXIT=$build_rc"
              echo 'FLASH_ALLOWED=NO'
              echo 'HARDWARE_TESTED=NO'
            } | tee "evidence/c12_base/$profile/result.txt"
            grep -nE 'fatal error:|error:|undefined reference|SUCCESS|FAILED' "evidence/c12_base/$profile/build.log" > "evidence/c12_base/$profile/errors.txt" || true
            grep -nE 'warning:' "evidence/c12_base/$profile/build.log" > "evidence/c12_base/$profile/warnings.txt" || true
            grep -nE 'RAM:|Flash:' "evidence/c12_base/$profile/build.log" > "evidence/c12_base/$profile/ram_flash.txt" || true
            grep -nE 'framework-arduinoststm32|toolchain-gccarmnoneeabi|PACKAGES:' "evidence/c12_base/$profile/build.log" > "evidence/c12_base/$profile/framework_packages.txt" || true
            tail -n 45 "evidence/c12_base/$profile/build.log"
            if [ "$build_rc" -ne 0 ]; then fail=1; fi
          done
          exit "$fail"

      - name: Archive every log on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV04_C13_BASELINE_C12_STM32_LOGS_NO_FLASH
          path: evidence/
          if-no-files-found: warn

  c13_changes:
    name: "Integrated build: NEW copy (C12 + C13 + DWIN319+320+321+322), host tests, both profiles, firmware export"
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout input files
        uses: actions/checkout@v4
      - name: Verify inputs (resolved by prefix and SHA-256 - 318 hand-over, Claude C9, C10, C11, C12, C13)
        shell: bash
        run: |
          set -euo pipefail
