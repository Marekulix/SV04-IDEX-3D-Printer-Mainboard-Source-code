          p=Path('oem_c13/Marlin/src/lcd/e3v2/creality/LCD_RTS.cpp')
          expected='7cc50482d5f805887429d0de2b029d69557290e0ecd674cad9abbe9210f425cf'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==expected, 'DWIN323 source mismatch; refuse patch'
          s=p.read_text()
          needle='queue.enqueue_now_P(PSTR("M420 S1"));'
          assert s.count(needle)==3, 'unexpected M420 S1 call count'
          s=s.replace(needle, '// SV04 325: Do not enable leveling without a verified, machine-specific mesh.\n    // Activate deliberately with M420 S1 only after mesh validation.')
          p.write_text(s)
          assert s.count(needle)==0
          assert 'SV04 DWIN: EEPROM init denied while printer active' in s
          assert 'SV04 DWIN: power-loss resume denied; verify home and idle' in s
          print('DWIN325_SOURCE_CHECKS=PASS')
          print('DWIN325_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          PY325
          echo 'DWIN325_INTEGRATED_ON_C13=YES' | tee evidence/dwin325_status.txt

      - name: Apply 328A settings.cpp patch on the DWIN325 tree and run its host tests (strict hashes, NO FLASH)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          F328=""
          for f in SV04_NEXT_CLAUDE_328A_EEPROM_FELDER_SETTINGS*.zip; do
            if [ "$(sha256sum -- "$f" | cut -d' ' -f1)" = "313b095bb25c18ba57fb4866f202bd3630ce59f20801a72cbbe9124cbc7a94fd" ]; then F328="$f"; break; fi
          done
          test -n "$F328" || { echo "FEHLT: SV04_NEXT_CLAUDE_328A_EEPROM_FELDER_SETTINGS*.zip mit sha256 313b095bb25c18ba57fb4866f202bd3630ce59f20801a72cbbe9124cbc7a94fd im Repository-Stamm" >&2; ls -la >&2; exit 1; }
          echo "F328=$F328" | tee -a evidence/input_names.txt
          unzip -t "$F328" > evidence/zip_328a_integrity.txt
          unzip -q "$F328" -d c328pkg
          P=c328pkg/SV04_NEXT_CLAUDE_328A_EEPROM_FELDER_SETTINGS
          sha256sum oem_c13/Marlin/src/module/settings.cpp | tee evidence/settings_before_328a.txt
          grep -F "e62c86fe73b7583486f412662c9db0f740b5dceea50734aa4c4eb02718303338" evidence/settings_before_328a.txt
          python3 -I $P/02_PATCH/apply_328.py oem_c13/Marlin 2>&1 | tee evidence/apply_328a.txt
          grep -F "bb5043f4d6df93df6c1d030fc677ffa5478ba59d04a9fd3d548769610ab9bd66" evidence/apply_328a.txt
          cmp oem_c13/Marlin/src/module/settings.cpp $P/01_QUELLEN/geaendert/Marlin/src/module/settings.cpp
          (cd $P/03_TESTS && python3 -I test_328.py) 2>&1 | tee evidence/c328a_host_tests.txt
          grep -F "0 FAIL" evidence/c328a_host_tests.txt
          # Belege fuer die Annahmen der Hosttests (echte Makrodefinitionen im Baum)
          grep -rnE "define +(EEPROM_START|EEPROM_READ|EEPROM_READ_ALWAYS|EEPROM_WRITE|EEPROM_SKIP|EEPROM_FINISH)\b" oem_c13/Marlin/src > evidence/eeprom_macros_real.txt || true
          grep -rnE "define +(SERIAL_ERROR_MSG|SERIAL_ERROR_START|SERIAL_ECHOLNPGM)\b" oem_c13/Marlin/src > evidence/serial_macros_real.txt || true
          cat evidence/eeprom_macros_real.txt evidence/serial_macros_real.txt | head -40

      - name: Build STM32 profiles independently, framework-first, NO FLASH
        shell: bash
        run: |
          # NEVER call `pio run -t clean` before framework is installed.
          # On a virgin runner this invokes generic_create_variant.py before
          # framework-arduinoststm32 exists (verified failure in GitHub 308).
          # A standard first `pio run` installs framework BEFORE pre scripts;
          # this sequence is proven by BOTH successful 291 STM32 build logs.
          set +e
          fail=0
          for profile in integrated_backend integrated_failclosed; do
            mkdir -p "evidence/c13/$profile"
            # Invalidate generated object files, NOT package/toolchain caches.
            # This prevents accidentally reusing backend objects in failclosed.
            rm -rf oem_c13/.pio/build/STM32F103RET6_creality
            if [ "$profile" = integrated_failclosed ]; then
              export PLATFORMIO_BUILD_FLAGS='-DSV04_CLAUDE_HOME_BACKEND_AVAILABLE=0'
            else
              export PLATFORMIO_BUILD_FLAGS=''
            fi
            /tmp/sv04_pio_309/bin/pio run -d oem_c13 -e STM32F103RET6_creality > "evidence/c13/$profile/build.log" 2>&1
            build_rc=$?
            # Exit 0 alone is not accepted without the PIO SUCCESS marker.
            if [ "$build_rc" -eq 0 ] && ! grep -Fq '[SUCCESS]' "evidence/c13/$profile/build.log"; then
              echo 'FAIL: PIO exit 0 without a build SUCCESS marker' >> "evidence/c13/$profile/build.log"
              build_rc=42
            fi
            if [ "$build_rc" -eq 0 ]; then
              mkdir -p "bin/$profile"
              find oem_c13/.pio/build/STM32F103RET6_creality -maxdepth 1 -type f \( -name '*.bin' -o -name 'firmware.elf' \) -exec cp {} "bin/$profile/" \;
              (cd "bin/$profile" && sha256sum * > SHA256SUMS.txt 2>/dev/null) || true
              echo 'C13+DWIN319+DWIN320+DWIN321+DWIN322+DWIN323+DWIN325: DEVELOPMENT ONLY. FLASH_ALLOWED=NO HARDWARE_TESTED=NO. DWIN and IDEX hardware safety still unverified.' > "bin/$profile/NOT_APPROVED.txt"
            fi
            {
              echo "BUILD_TREE=oem_c13"
              echo "PROFILE=$profile"
              echo 'BUILD_STRATEGY=FRAMEWORK_FIRST_DIRECT_PIO_RUN'
              echo 'SOURCE_BASE=ROUTE_B_C13_PLUS_DWIN319_DWIN320_DWIN321_DWIN322_DWIN323_DWIN325_ON_C12_ON_C11_ON_C10_ON_C9_ON_318_NEW_COPY'
              echo "BUILD_EXIT=$build_rc"
              echo 'FLASH_ALLOWED=NO'
              echo 'HARDWARE_TESTED=NO'
            } | tee "evidence/c13/$profile/result.txt"
            grep -nE 'fatal error:|error:|undefined reference|SUCCESS|FAILED' "evidence/c13/$profile/build.log" > "evidence/c13/$profile/errors.txt" || true
            grep -nE 'warning:' "evidence/c13/$profile/build.log" > "evidence/c13/$profile/warnings.txt" || true
            grep -nE 'RAM:|Flash:' "evidence/c13/$profile/build.log" > "evidence/c13/$profile/ram_flash.txt" || true
            grep -nE 'framework-arduinoststm32|toolchain-gccarmnoneeabi|PACKAGES:' "evidence/c13/$profile/build.log" > "evidence/c13/$profile/framework_packages.txt" || true
            tail -n 45 "evidence/c13/$profile/build.log"
            if [ "$build_rc" -ne 0 ]; then fail=1; fi
          done
          exit "$fail"

      - name: Upload compiled firmware files (NOT approved for flashing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV04_328A_INTEGRATED_BINARIES_NO_FLASH_APPROVAL
          path: bin/
          if-no-files-found: warn

      - name: Export sources and CORRECT preprocessor extracts for the EEPROM chain test (NON-FATAL, no effect on build result)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          unset PLATFORMIO_BUILD_FLAGS
          mkdir -p export/src export/pre
          for pat in settings.cpp settings.h 'M500-M504.cpp' 'eeprom*.cpp' 'eeprom*.h' 'persistent_store*' 'serial.h' 'macros.h' 'MarlinConfig.h' powerloss.cpp powerloss.h; do
            find oem_c13/Marlin/src -name "$pat" -print | while read -r f; do mkdir -p "export/src/$(dirname "${f#oem_c13/}")"; cp "$f" "export/src/${f#oem_c13/}"; done
          done
          cp oem_c13/Marlin/Configuration.h oem_c13/Marlin/Configuration_adv.h export/src/ 2>/dev/null
          cp evidence/eeprom_macros_real.txt evidence/serial_macros_real.txt export/ 2>/dev/null
          /tmp/sv04_pio_309/bin/pio run -d oem_c13 -e STM32F103RET6_creality -t compiledb > export/pre/compiledb.log 2>&1
          python3 - <<'PYX' > export/pre/LOG.txt 2>&1
          import json, re, shlex, subprocess, os, glob
          root = os.path.abspath('oem_c13'); outdir = os.path.abspath('export/pre')
          db = glob.glob('oem_c13/compile_commands.json') + glob.glob('oem_c13/.pio/build/*/compile_commands.json')
          print('compile_commands:', db)
          want = ('settings.cpp', 'M500-M504.cpp', 'eeprom_flash.cpp', 'eeprom_wired.cpp', 'eeprom_bl24cxx.cpp', 'eeprom_if.cpp')
          if db:
              for e in json.load(open(db[0])):
                  d = e.get('directory') or root
                  f = os.path.normpath(os.path.join(d, e['file']))
                  if os.path.basename(f) not in want: continue
                  a = shlex.split(e.get('command') or ' '.join(e['arguments'])); out = []; i = 0
                  while i < len(a):
                      if a[i] == '-o': i += 2; continue
                      if a[i] == '-c': i += 1; continue
                      out.append(a[i]); i += 1
                  rel = os.path.relpath(f, root) if f.startswith(root) else f
                  base = re.sub(r'[^A-Za-z0-9_.]+', '_', rel).strip('_')
                  for flag, suf in (('-E', '.i'), ('-E -dM', '.macros')):
                      r = subprocess.run(out + flag.split() + ['-o', os.path.join(outdir, base + suf)], capture_output=True, text=True, cwd=d)
                      print(base, flag, 'rc=%d' % r.returncode, r.stderr[:300].replace('\n', ' '))
          PYX
          (cd export && find . -type f ! -name SHA256SUMS.txt | sort | xargs sha256sum > SHA256SUMS.txt)
          du -sh export; cat export/pre/LOG.txt | head -20
      - name: Upload source export (diagnostic only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV04_328A_EEPROM_SOURCE_EXPORT_DIAGNOSTIC
          path: export/
          if-no-files-found: ignore

      - name: Archive every log on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV04_C13_DWIN325_CHANGED_STM32_LOGS_NO_FLASH
          path: evidence/
          if-no-files-found: warn

  evaluate_builds:
    name: "Evaluate both build jobs (no blanket success; red unless all four combinations are proven PASS)"
    runs-on: ubuntu-24.04
    needs: [baseline_c12, c13_changes]
    if: always()
    steps:
      - name: Checkout input files
        uses: actions/checkout@v4
      - name: Verify and unpack the C9 package (evaluator; resolved by prefix + SHA-256)
        shell: bash
        run: |
          set -euo pipefail
          resolve() {
            # Android haengt bei Mehrfach-Uploads " (1)" an. Datei wird ueber Namenspraefix UND SHA-256 gefunden, nie ueber den exakten Namen.
            local prefix="$1" hash="$2" f
            shopt -s nullglob
            for f in "$prefix"*.zip; do
              if [ "$(sha256sum -- "$f" | cut -d' ' -f1)" = "$hash" ]; then printf '%s' "$f"; return 0; fi
            done
            echo "FEHLT: keine Datei '$prefix*.zip' mit sha256 $hash im Repository-Stamm" >&2; ls -la >&2; return 1
          }
          F9="$(resolve SV04_NEXT_CLAUDE_C9_IDEX_BLTOUCH_G28_ABSCHLUSS d7af0fa681d03112defd3b58618d3eef573ccc72d2d29a7efb7e5431e638a5eb)"
          echo "d7af0fa681d03112defd3b58618d3eef573ccc72d2d29a7efb7e5431e638a5eb  $F9" | sha256sum -c -
          unzip -q "$F9" -d c9pkg
      - name: Download both build artifacts (whatever exists)
        uses: actions/download-artifact@v4
        with:
          pattern: SV04_C13_*_STM32_LOGS_NO_FLASH
          path: art
      - name: Evaluate (exit code 0 only if oem_c12 and oem_c13 are PASS for both profiles)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evaluation
          python3 c9pkg/02_PATCHES/evaluate_builds_c9.py art --trees oem_c12,oem_c13 --out evaluation/EVALUATION.md 2>&1 | tee evaluation/evaluation_stdout.txt
          exit "${PIPESTATUS[0]}"
      - name: Upload evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV04_C13_DWIN325_EVALUATION
          path: evaluation/
          if-no-files-found: warn