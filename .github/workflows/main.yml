name: SV04 Originalfirmware testen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: PlatformIO installieren
        run: python -m pip install platformio==6.1.18

      - name: Originalfirmware kompilieren
        shell: bash
        run: |
          set -o pipefail
          pio run -e STM32F103RET6_creality 2>&1 | tee build.log

      - name: Ergebnisse sichern
        if: always()
        run: |
          mkdir -p ergebnis
          echo "NICHT FLASHEN - Nur Referenzbuild" > ergebnis/LESEN.txt
          git rev-parse HEAD > ergebnis/commit.txt
          if [ -f build.log ]; then
            cp build.log ergebnis/
          fi
          if [ -d .pio/build/STM32F103RET6_creality ]; then
            find .pio/build/STM32F103RET6_creality -maxdepth 1 -type f \( -name "*.bin" -o -name "*.elf" \) -exec cp {} ergebnis/ \;
          fi
          (cd ergebnis && sha256sum * > sha256.txt)

      - name: Ergebnis bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV04-Originalbuild-NICHT-FLASHEN
          path: ergebnis/
