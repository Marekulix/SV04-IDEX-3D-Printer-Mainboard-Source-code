name: SV04 NEXT Sammeltest 10.41-10.46 Native Build - NICHT FLASHEN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-guard-compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Originales Sovol Marlin aus diesem Repository laden
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Experimentelle Tests nur im temporaeren GitHub Runner entpacken
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_BUNDLED'
          import gzip,base64,pathlib
          files={
            'integration/apply_native_guard_v2.py': '',
            'tests/test_overlay_v2.py': '',
            'tests/test_rts_rollback_map.py': '',
            'tests/test_auto60_safety.cpp': '',
            'tests/test_journal.cpp': '',
            'tests/test_orchestrator.cpp': '',
            'tests/test_faultmatrix.cpp': '',
            'tests/test_rts_telemetry.cpp': '',
            'tests/test_g29_transaction_model.cpp': '',
            'tests/run_all_local.sh': '',
            'include/SV04NextMeshJournal.hpp': '',
            'include/SV04NextRtsTelemetry.hpp': '',
            'include/SV04NextAuto60Orchestrator.hpp': '',
            'include/SV04NextAuto60Safety.hpp': '',
            'include/SV04NextDwinView.hpp': '',
          }
          for name, data in files.items():
              dest=pathlib.Path(name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(gzip.decompress(base64.b64decode(data)))
              print('Host test source extracted:',name)
          PY_BUNDLED

      - name: Alte und neue Host-Sicherheitstests ausfuehren
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-evidence
          bash tests/run_all_local.sh 2>&1 | tee build-evidence/host-tests.log

      - name: Verifizierten OEM Marlin Quellcode experimentell patchen
        shell: bash
        run: |
          set -euo pipefail
          python3 integration/apply_native_guard_v2.py --root . --evidence build-evidence/native-overlay.json 2>&1 | tee build-evidence/patch.log

      - name: PlatformIO 6.1.18 installieren
        run: python3 -m pip install platformio==6.1.18

      - name: Wirklich den experimentellen STM32 OEM Marlin Build kompilieren
        shell: bash
        run: |
          set -euo pipefail
          pio run -e STM32F103RET6_creality 2>&1 | tee sv04-next-1041-1046-compile.log

      - name: Nachweise und bin nur als NICHT FLASHEN sichern
        shell: bash
        if: always()
        run: |
          mkdir -p build-evidence
          echo 'SV04 NEXT 10.41-10.46: NO HARDWARE VALIDATION. DO NOT FLASH!' > build-evidence/NICHT_FLASHEN.txt
          git rev-parse HEAD > build-evidence/oem_commit.txt
          git status --short > build-evidence/source_changes.txt
          if [ -f sv04-next-1041-1046-compile.log ]; then
            cp sv04-next-1041-1046-compile.log build-evidence/compile.log
          fi
          if [ -f .pio/build/STM32F103RET6_creality/firmware.bin ]; then
            cp .pio/build/STM32F103RET6_creality/firmware.bin build-evidence/EXPERIMENTELL_NICHT_FLASHEN.bin
            sha256sum build-evidence/EXPERIMENTELL_NICHT_FLASHEN.bin > build-evidence/firmware-sha256.txt
          fi
          sha256sum Marlin/Configuration.h Marlin/src/module/probe.cpp Marlin/src/gcode/bedlevel/abl/G29.cpp > build-evidence/patched-source-sha256.txt

      - name: Eine Sammel-ZIP fuer ChatGPT bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV04-NEXT-1041-1046-DIAGNOSE-NICHT-FLASHEN
          path: build-evidence/
          if-no-files-found: error
