name: SV04 NEXT - experimenteller Marlin-Build NICHT FLASHEN
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sv04-next:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Original Marlin auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Experimentelle Dateien nur im CI-Runner erzeugen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, pathlib
          files = {
              'integration/apply_sv04_next.py': '',
              'integration/SV04NextBedAudit.hpp': '',
              'integration/SV04NextResources.hpp': '',
              'tests/test_host.cpp': '',
              'tests/test_overlay.py': '',
          }
          for name, payload in files.items():
              target=pathlib.Path(name)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(gzip.decompress(base64.b64decode(payload)))
              print("Restored", name)
          PY
          python tests/test_overlay.py
          python integration/apply_sv04_next.py --root . --sources integration --output build-evidence/overlay.json
      - name: Native Hosttests (nur simulierte Eingaben)
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -pedantic tests/test_host.cpp -o /tmp/sv04-next-host
          /tmp/sv04-next-host | tee build-evidence/host-tests.txt
      - name: PlatformIO installieren
        run: python -m pip install platformio==6.1.18
      - name: Experimentellen Marlin-Quellstand kompilieren
        id: build
        shell: bash
        run: |
          set -o pipefail
          pio run -e STM32F103RET6_creality 2>&1 | tee sv04-next-build.log
      - name: Nachweise sammeln
        if: always()
        shell: bash
        run: |
          mkdir -p build-evidence
          git rev-parse HEAD > build-evidence/original-commit.txt
          git status --short > build-evidence/changed-files.txt
          if [ -f sv04-next-build.log ]; then cp sv04-next-build.log build-evidence/compile.log; fi
          echo "EXPERIMENT - NICHT FLASHEN - NICHT AM DRUCKER TESTEN" > build-evidence/NICHT_FLASHEN.txt
          if [ -f .pio/build/STM32F103RET6_creality/firmware.bin ]; then
            cp .pio/build/STM32F103RET6_creality/firmware.bin build-evidence/SV04_NEXT_EXPERIMENT_NICHT_FLASHEN.bin
            sha256sum build-evidence/SV04_NEXT_EXPERIMENT_NICHT_FLASHEN.bin > build-evidence/firmware_sha256.txt
          fi
      - name: Ergebnisse speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV04-NEXT-10-17-10-21-NICHT-FLASHEN
          path: build-evidence/
          if-no-files-found: error
