name: '3'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build3:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Checkout official Sovol Marlin
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore bundled checked sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_BUNDLED'
          import gzip,base64,pathlib,hashlib
          files={
            'include/SV04Next20PhaseContract.hpp': '',
            'include/SV04NextAbortQuarantine.hpp': '',
            'include/SV04NextAbortSupervisor.hpp': '',
            'include/SV04NextAuto60Orchestrator.hpp': '',
            'include/SV04NextAuto60Policy.hpp': '',
            'include/SV04NextAuto60Safety.hpp': '',
            'include/SV04NextAuto60ViewModel.hpp': '',
            'include/SV04NextCommandHandshake.hpp': '',
            'include/SV04NextDwinStatusContract.hpp': '',
            'include/SV04NextDwinView.hpp': '',
            'include/SV04NextFaultTrace.hpp': '',
            'include/SV04NextG28G29OrderWitness.hpp': '',
            'include/SV04NextG28PassiveReceipt.hpp': '',
            'include/SV04NextG29UDisplayFrame.hpp': '',
            'include/SV04NextG29UReceipt.hpp': '',
            'include/SV04NextHomingWitness.hpp': '',
            'include/SV04NextM190PassiveReceipt.hpp': '',
            'include/SV04NextMeshIntegrity.hpp': '',
            'include/SV04NextMeshJournal.hpp': '',
            'include/SV04NextMeshMapPacket.hpp': '',
            'include/SV04NextNativeAuto60Flow.hpp': '',
            'include/SV04NextNativeDispatchInterlock.hpp': '',
            'include/SV04NextNativeEventTimeline.hpp': '',
            'include/SV04NextNativeHardwareAttestation.hpp': '',
            'include/SV04NextNativeOneButtonPreview.hpp': '',
            'include/SV04NextNativeReadiness.hpp': '',
            'include/SV04NextNativeStatusPacket.hpp': '',
            'include/SV04NextNativeThermalGate.hpp': '',
            'include/SV04NextOneButtonPlan.hpp': '',
            'include/SV04NextOperationLedger.hpp': '',
            'include/SV04NextReceiptBinder.hpp': '',
            'include/SV04NextRtsTelemetry.hpp': '',
            'include/SV04NextSequencedController.hpp': '',
            'include/SV04NextT1EndstopObserver.hpp': '',
            'include/SV04NextThermalWitness.hpp': '',
            'include/SV04NextVisitProof.hpp': '',
            'integration/apply_native_guard_v10.py': '',
            'integration/apply_native_guard_v11.py': '',
            'integration/apply_native_guard_v12.py': '',
            'integration/apply_native_guard_v13.py': '',
            'integration/apply_native_guard_v14.py': '',
            'integration/apply_native_guard_v15.py': '',
            'integration/apply_native_guard_v16.py': '',
            'integration/apply_native_guard_v17.py': '',
            'integration/apply_native_guard_v18.py': '',
            'integration/apply_native_guard_v19.py': '',
            'integration/apply_native_guard_v2.py': '',
            'integration/apply_native_guard_v3.py': '',
            'integration/apply_native_guard_v4.py': '',
            'integration/apply_native_guard_v5.py': '',
            'integration/apply_native_guard_v6.py': '',
            'integration/apply_native_guard_v7.py': '',
            'integration/apply_native_guard_v8.py': '',
            'integration/apply_native_guard_v9.py': '',
            'tests/run_all_local.sh': '',
            'tests/run_block10_local.sh': '',
            'tests/run_block11_local.sh': '',
            'tests/run_block12_local.sh': '',
            'tests/run_block5_only.sh': '',
            'tests/test_20_phase_contract.cpp': '',
            'tests/test_abort_quarantine.cpp': '',
            'tests/test_abort_supervisor.cpp': '',
            'tests/test_auto60_e2e_simulation.cpp': '',
            'tests/test_auto60_full_contract.cpp': '',
            'tests/test_auto60_safety.cpp': '',
            'tests/test_auto60_view_model.cpp': '',
            'tests/test_block5_contract.py': '',
            'tests/test_command_handshake.cpp': '',
            'tests/test_dwin_status_contract.cpp': '',
            'tests/test_fault_trace.cpp': '',
            'tests/test_faultmatrix.cpp': '',
            'tests/test_g28_full_cycle.cpp': '',
            'tests/test_g28_g29_order.cpp': '',
            'tests/test_g28_receipt.cpp': '',
            'tests/test_g29_transaction_model.cpp': '',
            'tests/test_g29u_display_frame.cpp': '',
            'tests/test_g29u_receipt.cpp': '',
            'tests/test_homing_witness.cpp': '',
            'tests/test_journal.cpp': '',
            'tests/test_m190_native_flow.cpp': '',
            'tests/test_mesh_integrity.cpp': '',
            'tests/test_mesh_map_packet.cpp': '',
            'tests/test_native_diagnostics_replay.cpp': '',
            'tests/test_native_dispatch_interlock.cpp': '',
            'tests/test_native_event_timeline.cpp': '',
