            'tests/test_one_button_plan.cpp': '',
            'tests/test_operation_ledger.cpp': '',
            'tests/test_orchestrator.cpp': '',
            'tests/test_overlay_v10.py': '',
            'tests/test_overlay_v11.py': '',
            'tests/test_overlay_v12.py': '',
            'tests/test_overlay_v13.py': '',
            'tests/test_overlay_v14.py': '',
            'tests/test_overlay_v15.py': '',
            'tests/test_overlay_v16.py': '',
            'tests/test_overlay_v17.py': '',
            'tests/test_overlay_v18.py': '',
            'tests/test_overlay_v19.py': '',
            'tests/test_overlay_v2.py': '',
            'tests/test_overlay_v3.py': '',
            'tests/test_overlay_v4.py': '',
            'tests/test_overlay_v5.py': '',
            'tests/test_overlay_v6.py': '',
            'tests/test_overlay_v7.py': '',
            'tests/test_overlay_v8.py': '',
            'tests/test_overlay_v9.py': '',
            'tests/test_receipt_binder.cpp': '',
            'tests/test_rts_rollback_map.py': '',
            'tests/test_rts_telemetry.cpp': '',
            'tests/test_sequenced_controller.cpp': '',
            'tests/test_t1_endstop_observer.cpp': '',
            'tests/test_thermal_witness.cpp': '',
            'tests/test_visit_proof.cpp': '',
          }
          for name,payload in files.items():
              path=pathlib.Path(name)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(gzip.decompress(base64.b64decode(payload)))
              print("RESTORED",name,hashlib.sha256(path.read_bytes()).hexdigest())
          PY_BUNDLED
      - name: Test all old and new native safety blocks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          bash tests/run_all_local.sh 2>&1 | tee evidence/host-regressions.log
          bash tests/run_block10_local.sh 2>&1 | tee evidence/block10.log
          bash tests/run_block11_local.sh 2>&1 | tee evidence/block11.log
          bash tests/run_block12_local.sh 2>&1 | tee evidence/block12.log
      - name: Apply stage-50 guarded native Marlin overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 integration/apply_native_guard_v19.py --root . --evidence evidence/native-overlay.json 2>&1 | tee evidence/overlay-application.log
          git diff --exit-code -- Marlin/Configuration.h Marlin/src/module/probe.cpp
          git diff --check
          python3 - <<'PY_SAFE'
          from pathlib import Path
          g=Path('Marlin/src/gcode/bedlevel/abl/G29.cpp').read_text()
          assert 'NativeHardwareAttestation::t1_park_certified()' in g
          assert 'SV04 NEXT G29U REFUSED: physical T1 parking is unverified' in g
          r=Path('Marlin/src/lcd/e3v2/creality/LCD_RTS.cpp').read_text()
          assert 'native_dispatch_interlock.observe(' in r
          print('G29 U hard block and read-only dispatcher present')
          PY_SAFE
          git status --short > evidence/source-changes.txt
      - name: Install PlatformIO
        shell: bash
        run: |
          python3 -m pip install platformio==6.1.18
      - name: STM32 native compile checkpoint 50 percent - do not flash
        shell: bash
        run: |
          set -euo pipefail
          pio run -e STM32F103RET6_creality 2>&1 | tee compile.log
          python3 - <<'PY_PROOF'
          import json,pathlib
          p=pathlib.Path('evidence/build-proof.json')
          p.write_text(json.dumps({
            'status':'native_compile_passed', 'hardware_tested':False,
            'flash_approved':False,'physical_t1_verified':False,
            'endstop_pin_observed_read_only':True,
            'g29u_hard_disabled_pending_t1_certification':True,
            'read_only_native_dispatch_interlock':True,
            'automatic_heating':False,'automatic_g28':False,'automatic_g29':False,
            'eeprom_auto_save':False,'new_dwin_hmi_button':False
          },indent=2)+'\n')
          PY_PROOF
      - name: Preserve build evidence without flashable binary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf '%s\n' 'NICHT FLASHEN: CHECKPOINT 50%; G29 U IS BLOCKED; NO SAFE T1 PROOF, NO TOUCH BUTTON, NO EEPROM.' > evidence/NICHT_FLASHEN.txt
          git rev-parse HEAD > evidence/original-commit.txt
          git status --short > evidence/source-changes.txt
          if test -f compile.log; then cp compile.log evidence/compile.log; fi
          if test -f .pio/build/STM32F103RET6_creality/firmware.bin; then
            sha256sum .pio/build/STM32F103RET6_creality/firmware.bin > evidence/firmware-sha256-proof-only.txt
            wc -c < .pio/build/STM32F103RET6_creality/firmware.bin > evidence/firmware-size-proof-only.txt
          fi
      - name: '3'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: '3'
          path: evidence/
          if-no-files-found: error
