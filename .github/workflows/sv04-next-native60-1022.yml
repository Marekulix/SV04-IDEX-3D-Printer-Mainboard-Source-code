name: SV04 NEXT 10.22-10.26 Native G29 Diagnose - NICHT FLASHEN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-g29-diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Originales Sovol Marlin laden
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.11 installieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test- und Diagnosedateien nur temporär im Build-Runner erzeugen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_PAYLOAD'
          import base64, gzip, pathlib
          payloads = {
              'integration/SV04NextBedAudit.hpp': '',
              'integration/SV04NextResources.hpp': '',
              'integration/apply_sv04_next.py': '',
              'integration/SV04NextNative60Diagnostics.hpp': '',
              'integration/SV04NextAuto60Plan.hpp': '',
              'integration/apply_sv04_next_1022.py': '',
              'tests/test_host.cpp': '',
              'tests/test_overlay.py': '',
              'tests/test_native.cpp': '',
              'tests/test_overlay_1022.py': '',
          }
          for filename, encoded in payloads.items():
              dest = pathlib.Path(filename)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(gzip.decompress(base64.b64decode(encoded)))
              print('source:', filename)
          PY_PAYLOAD

      - name: Originale und neue C++ Sicherheitstests sowie Patch-Anker testen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-evidence
          python tests/test_overlay.py | tee build-evidence/previous-overlay-tests.log
          python tests/test_overlay_1022.py | tee build-evidence/native-overlay-tests.log
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -pedantic tests/test_host.cpp -o /tmp/sv04-previous-host
          /tmp/sv04-previous-host | tee build-evidence/previous-host-tests.log
          g++ -std=c++11 -O0 -Wall -Wextra -Werror -pedantic tests/test_native.cpp -o /tmp/sv04-native-host-debug
          /tmp/sv04-native-host-debug | tee build-evidence/native-host-debug-tests.log
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -pedantic tests/test_native.cpp -o /tmp/sv04-native-host-optimized
          /tmp/sv04-native-host-optimized | tee build-evidence/native-host-optimized-tests.log
          python integration/apply_sv04_next_1022.py --root . --sources integration --output build-evidence/native-overlay.json

      - name: PlatformIO installieren
        run: python -m pip install platformio==6.1.18

      - name: Veraendertes OEM Marlin tatsaechlich kompilieren
        shell: bash
        run: |
          set -o pipefail
          pio run -e STM32F103RET6_creality 2>&1 | tee sv04-next-build.log

      - name: Nachweise und experimentelle Firmware sichern
        if: always()
        shell: bash
        run: |
          mkdir -p build-evidence
          echo 'EXPERIMENTELL / KEIN HARDWARETEST / NICHT FLASHEN' > build-evidence/NICHT_FLASHEN.txt
          git rev-parse HEAD > build-evidence/oem_commit.txt
          git status --short > build-evidence/source_changes.txt
          if [ -f sv04-next-build.log ]; then cp sv04-next-build.log build-evidence/compile.log; fi
          if [ -f .pio/build/STM32F103RET6_creality/firmware.bin ]; then
            cp .pio/build/STM32F103RET6_creality/firmware.bin build-evidence/SV04_NEXT_10_22_NICHT_FLASHEN.bin
            sha256sum build-evidence/SV04_NEXT_10_22_NICHT_FLASHEN.bin > build-evidence/FIRMWARE_SHA256.txt
          fi
          sha256sum Marlin/Configuration.h platformio.ini > build-evidence/OEM_CONFIG_SHA256.txt

      - name: Testergebnisse als ZIP aufbewahren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV04-NEXT-10-22-10-26-NICHT-FLASHEN
          path: build-evidence/
          if-no-files-found: error
