name: "SV04 435 W72 = W71 verified patch plus REAL 434 DWIN integration + dual STM32 + EEPROM - NO FLASH"

# EXTERNE ABHAENGIGKEIT (ins Repository-Stamm hochladen; Android-Name mit "(1)" ist erlaubt):
#   SV04_CLAUDE_401_01_QUELLCODE_396*.zip   sha256 cd93ce867c7d92adce777e1db902f8e0fa4a2e09c74a0549fdc60f7f79082414
# Alles andere (Testpaket t401, SHA-256 gebunden) ist in dieser Datei eingebettet. Kein OEM-Checkout noetig (396-Quellbaum ist vollstaendig).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eeprom_401:
    name: "435 W72: real v434 DWIN source builds from W71 verified baseline"
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Checkout input files
        uses: actions/checkout@v4
      - name: Verify external ZIP (resolved by prefix and SHA-256), unpack, verify source hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          want="cd93ce867c7d92adce777e1db902f8e0fa4a2e09c74a0549fdc60f7f79082414"; found=""
          for f in SV04_CLAUDE_401_01_QUELLCODE_396*.zip; do
            [ -f "$f" ] || continue
            if [ "$(sha256sum "$f" | cut -d' ' -f1)" = "$want" ]; then found="$f"; break; fi
          done
          if [ -z "$found" ]; then echo "FEHLT: SV04_CLAUDE_401_01_QUELLCODE_396*.zip mit sha256 $want im Repository-Stamm" >&2; ls -la >&2; exit 1; fi
          echo "EXTERN_ZIP=$found" | tee evidence/extern_zip.txt
          mkdir -p in396 && unzip -q -o "$found" -d in396
          (cd in396 && unzip -q -o QUELLCODE_396_W58.zip -d s)
          echo "3c8b5aa397c79da7a7130f463b2e2ed0af246b728de2968e8b4d5069fa82c4b7  in396/s/Marlin_396_integrated_source.tar.gz" | sha256sum -c - | tee evidence/tar_hash.txt
          mkdir -p oem_c13 && tar -xzf in396/s/Marlin_396_integrated_source.tar.gz -C oem_c13
          cat > evidence/key_hashes.expected <<'EOT'
          9af81189acc75b6fe511ad9abd7e3ab35eb6967c8ab6184eac6f69c30c2e0505  oem_c13/Marlin/src/module/settings.cpp
          1c9355051e55137165812c8ea189f3fc48e88891cb762a8ed9d41083dc058a30  oem_c13/Marlin/src/gcode/eeprom/M500-M504.cpp
          0852f0e1823b97f812976315ce286ca05d12d4dda560315bde63bcc2fd558b4d  oem_c13/Marlin/src/lcd/e3v2/creality/LCD_RTS.cpp
          c727901c60730669212abce3aef6134959d0a31c8515c119d2d2220378e4c034  oem_c13/Marlin/src/module/sv04_claude_idex_guard.h
          EOT
          sed -i 's/^ *//' evidence/key_hashes.expected
          sha256sum -c evidence/key_hashes.expected | tee evidence/key_hashes.txt
      - name: Restore complete PlatformIO ini configuration omitted from W58 export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/config_restore
          test -f platformio.ini
          test -d ini
          test -f ini/stm32f1.ini
          test -f oem_c13/platformio.ini
          test -d oem_c13/buildroot
          # The verified W58 source archive omits ini/* even though its
          # platformio.ini references the directory. Use repository's
          # checked-out Marlin ini directory, without modifying firmware source.
          test ! -d oem_c13/ini || {
            echo 'Existing ini directory detected; refusing silent overwrite' >&2
            exit 1
          }
          cp -a ini oem_c13/ini
          grep -Fq '[env:STM32F103RET6_creality]' oem_c13/ini/stm32f1.ini
          sha256sum ini/stm32f1.ini oem_c13/ini/stm32f1.ini | tee evidence/config_restore/ini_sha256.txt
          cmp ini/stm32f1.ini oem_c13/ini/stm32f1.ini
          grep '^\s*extra_configs' oem_c13/platformio.ini | tee evidence/config_restore/extra_configs.txt
          echo 'PLATFORMIO_INI_RESTORED=PASS FLASH_ALLOWED=NO' | tee evidence/config_restore/result.txt
      - name: Install PlatformIO 6.1.18
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/sv04_pio
          /tmp/sv04_pio/bin/pip install 'platformio==6.1.18' > evidence/pio_install.txt 2>&1
          /tmp/sv04_pio/bin/pio --version | tee evidence/pio_version.txt
      - name: Unpack embedded test package t401 (SHA-256 checked)
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > t401.tgz
          echo "98377874992dc838168680ab7535524f72804d5e0eea6594c7ef622a06dcdb01  t401.tgz" | sha256sum -c - | tee evidence/t401_hash.txt
          tar -xzf t401.tgz
      - name: 378-380 native tests (DWIN X-jog IDEX guard, G90, pause-park relative mode) with mutants on the REAL 396 LCD_RTS.cpp (NO FLASH)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence/t380
          python3 -I t401/t380.py oem_c13/Marlin/src/lcd/e3v2/creality/LCD_RTS.cpp oem_c13/Marlin/src/module/sv04_claude_idex_guard.h evidence/t380 2>&1 | tee evidence/t380/stdout.txt
          [ "${PIPESTATUS[0]}" -eq 0 ] && grep -F "T380_RESULT PASS" evidence/t380/stdout.txt
      - name: Apply REAL 415-423 cumulative delta to verified source, hash-lock both changed files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/v424
          printf '%s' '' | base64 -d > v424_delta.patch.gz
          echo '3c243f2157984507e4fa7df488026d0f8e5d92fef808985284b412af06378592  v424_delta.patch' > evidence/v424/patch_sha256.expected
          gzip -dc v424_delta.patch.gz > v424_delta.patch
          sha256sum -c evidence/v424/patch_sha256.expected | tee evidence/v424/patch_hash.txt
          # Source tree must be unchanged original before applying the patch.
          echo "0852f0e1823b97f812976315ce286ca05d12d4dda560315bde63bcc2fd558b4d  oem_c13/Marlin/src/lcd/e3v2/creality/LCD_RTS.cpp" | sha256sum -c -
          echo "2dadd20e94c85e6c7a1d52165d915cb997d24a51959ba046606aac79fd2705e3  oem_c13/Marlin/src/module/motion.cpp" | sha256sum -c -
          (cd oem_c13 && git apply --check ../v424_delta.patch && git apply ../v424_delta.patch)
          # Assert the exact two source files are now IDENTICAL to the offline v423 archive.
          echo "61affbc3dbee391c330d65732d88695d0be69a73eefdd99991f994e12b65a766  oem_c13/Marlin/src/lcd/e3v2/creality/LCD_RTS.cpp" | sha256sum -c -
          echo "a597f0d1fdd08f8cb91c06b691239ca644f2ec0d15f795996b97d89771882ce0  oem_c13/Marlin/src/module/motion.cpp" | sha256sum -c -
          { echo 'W70_PATCH_APPLIED=PASS'; echo 'W71_SOURCE=423_INTEGRATED'; echo 'MODIFIED_SOURCE_FILES=2'; echo 'FLASH_ALLOWED=NO'; } | tee evidence/v424/result.txt
      - name: Apply REAL 426-434 DWIN cumulative changes after W71 verified v423 patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/v435
          printf '%s' '' | base64 -d | gzip -dc > v435_dwin.patch
          echo '7115b7d1876418b8c79a4d3c2e84fc5d0300494fb269abbf5eaed8f12afa8f4a  v435_dwin.patch' | sha256sum -c - | tee evidence/v435/delta_sha256.txt
          test ! -e oem_c13/Marlin/src/lcd/e3v2/creality/sv04_dwin_hmi_bindings.h
          echo '61affbc3dbee391c330d65732d88695d0be69a73eefdd99991f994e12b65a766  oem_c13/Marlin/src/lcd/e3v2/creality/LCD_RTS.cpp' | sha256sum -c -
          echo 'acfde9bbd7c3208266332d9596560eb77274b42ad94b1cfd55650b5459e8fd57  oem_c13/Marlin/src/lcd/e3v2/creality/LCD_RTS.h' | sha256sum -c -
          (cd oem_c13 && git apply --check ../v435_dwin.patch && git apply ../v435_dwin.patch)
          echo 'e5026f1b095190628de70c2e3eb9767727fc80f5ad998dabcb2b4205dad76173  oem_c13/Marlin/src/lcd/e3v2/creality/LCD_RTS.cpp' | sha256sum -c -
          echo '6bb7341508e45fae23a15b33552b25f9b704875689101ae0e5b47496966af5ab  oem_c13/Marlin/src/lcd/e3v2/creality/LCD_RTS.h' | sha256sum -c -
          echo '8ab2a786d637c34ff051c6b6b230a9e983ec40bb679086de7249bbb84a7ac6da  oem_c13/Marlin/src/lcd/e3v2/creality/sv04_dwin_hmi_bindings.h' | sha256sum -c -
          echo 'a597f0d1fdd08f8cb91c06b691239ca644f2ec0d15f795996b97d89771882ce0  oem_c13/Marlin/src/module/motion.cpp' | sha256sum -c -
          { echo 'W72_PATCH_APPLIED=PASS'; echo 'W72_SOURCE=434_INTEGRATED'; echo 'W72_NEW_DWIN_FILES=3'; echo 'FLASH_ALLOWED=NO'; echo 'HARDWARE_TESTED=NO'; } | tee evidence/v435/result.txt

      - name: Build STM32 profiles independently, framework-first, NO FLASH
        if: always()
        shell: bash
        run: |
          set +e
          fail=0
          for profile in integrated_backend integrated_failclosed; do
            mkdir -p "evidence/build/$profile"
            rm -rf oem_c13/.pio/build/STM32F103RET6_creality
            if [ "$profile" = integrated_failclosed ]; then export PLATFORMIO_BUILD_FLAGS='-DSV04_CLAUDE_HOME_BACKEND_AVAILABLE=0'; else export PLATFORMIO_BUILD_FLAGS=''; fi
            /tmp/sv04_pio/bin/pio run -d oem_c13 -e STM32F103RET6_creality > "evidence/build/$profile/build.log" 2>&1
            rc=$?
            if [ "$rc" -eq 0 ] && ! grep -Fq '[SUCCESS]' "evidence/build/$profile/build.log"; then echo 'FAIL: exit 0 without SUCCESS marker' >> "evidence/build/$profile/build.log"; rc=42; fi
            if [ "$rc" -eq 0 ]; then
              mkdir -p "bin/$profile"
              find oem_c13/.pio/build/STM32F103RET6_creality -maxdepth 1 -type f \( -name '*.bin' -o -name 'firmware.elf' \) -exec cp {} "bin/$profile/" \;
              (cd "bin/$profile" && sha256sum * > SHA256SUMS.txt 2>/dev/null) || true
              echo 'DEVELOPMENT ONLY. FLASH_ALLOWED=NO HARDWARE_TESTED=NO.' > "bin/$profile/NOT_APPROVED.txt"
            fi
            { echo "PROFILE=$profile"; echo "BUILD_EXIT=$rc"; echo FLASH_ALLOWED=NO; echo HARDWARE_TESTED=NO; } | tee "evidence/build/$profile/result.txt"
            grep -nE 'fatal error:|error:|undefined reference|SUCCESS|FAILED' "evidence/build/$profile/build.log" > "evidence/build/$profile/errors.txt" || true
            grep -nE 'RAM:|Flash:' "evidence/build/$profile/build.log" > "evidence/build/$profile/ram_flash.txt" || true
            tail -n 25 "evidence/build/$profile/build.log"
            [ "$rc" -ne 0 ] && fail=1
          done
          exit "$fail"
      - name: Verify EXACT v434 DWIN source was compiled (3 files and motion.cpp)
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'W72_SOURCE=434_INTEGRATED' evidence/v435/result.txt
          grep -Fxq 'W72_PATCH_APPLIED=PASS' evidence/v435/result.txt
          for p in integrated_backend integrated_failclosed; do
            grep -Fxq 'BUILD_EXIT=0' "evidence/build/$p/result.txt"
          done
          echo 'e5026f1b095190628de70c2e3eb9767727fc80f5ad998dabcb2b4205dad76173  oem_c13/Marlin/src/lcd/e3v2/creality/LCD_RTS.cpp' | sha256sum -c -
          echo '6bb7341508e45fae23a15b33552b25f9b704875689101ae0e5b47496966af5ab  oem_c13/Marlin/src/lcd/e3v2/creality/LCD_RTS.h' | sha256sum -c -
          echo '8ab2a786d637c34ff051c6b6b230a9e983ec40bb679086de7249bbb84a7ac6da  oem_c13/Marlin/src/lcd/e3v2/creality/sv04_dwin_hmi_bindings.h' | sha256sum -c -
          echo 'a597f0d1fdd08f8cb91c06b691239ca644f2ec0d15f795996b97d89771882ce0  oem_c13/Marlin/src/module/motion.cpp' | sha256sum -c -
          echo 'W72_STM32_434_SOURCE_LOCK=PASS' | tee evidence/v435/postbuild.txt

      - name: Verify the exact modified source was used by STM32 builds
        shell: bash
        run: |
          set -euo pipefail
          test -f evidence/v424/result.txt
          grep -Fxq 'W70_PATCH_APPLIED=PASS' evidence/v424/result.txt
          for p in integrated_backend integrated_failclosed; do
            grep -Fxq 'BUILD_EXIT=0' "evidence/build/$p/result.txt"
          done
          echo "e5026f1b095190628de70c2e3eb9767727fc80f5ad998dabcb2b4205dad76173  oem_c13/Marlin/src/lcd/e3v2/creality/LCD_RTS.cpp" | sha256sum -c -

          echo "a597f0d1fdd08f8cb91c06b691239ca644f2ec0d15f795996b97d89771882ce0  oem_c13/Marlin/src/module/motion.cpp" | sha256sum -c -
      - name: Export preprocessor extracts (.i/.macros) from the real build command lines
        if: always()
        shell: bash
        run: |
          set +e
          unset PLATFORMIO_BUILD_FLAGS
          mkdir -p export/pre
          /tmp/sv04_pio/bin/pio run -d oem_c13 -e STM32F103RET6_creality -t compiledb > export/pre/compiledb.log 2>&1
          python3 - <<'PYX' > export/pre/LOG.txt 2>&1
          import json, re, shlex, subprocess, os, glob
          root = os.path.abspath('oem_c13'); outdir = os.path.abspath('export/pre')
          db = glob.glob('oem_c13/compile_commands.json') + glob.glob('oem_c13/.pio/build/*/compile_commands.json')
          print('compile_commands:', db)
          want = ('settings.cpp', 'crc16.cpp', 'M500-M504.cpp', 'eeprom_flash.cpp', 'eeprom_wired.cpp', 'eeprom_bl24cxx.cpp')
          if db:
              for e in json.load(open(db[0])):
                  d = e.get('directory') or root
                  f = os.path.normpath(os.path.join(d, e['file']))
                  if os.path.basename(f) not in want: continue
                  a = shlex.split(e.get('command') or ' '.join(e['arguments'])); out = []; i = 0
                  while i < len(a):
                      if a[i] == '-o': i += 2; continue
                      if a[i] == '-c': i += 1; continue
                      out.append(a[i]); i += 1
                  rel = os.path.relpath(f, root) if f.startswith(root) else f
                  base = re.sub(r'[^A-Za-z0-9_.]+', '_', rel).strip('_')
                  for flag, suf in (('-E', '.i'), ('-E -dM', '.macros')):
                      r = subprocess.run(out + flag.split() + ['-o', os.path.join(outdir, base + suf)], capture_output=True, text=True, cwd=d)
                      print(base, flag, 'rc=%d' % r.returncode, r.stderr[:300].replace('\n', ' '))
          PYX
          (cd export && find . -type f ! -name SHA256SUMS.txt | sort | xargs sha256sum > SHA256SUMS.txt)
          cat export/pre/LOG.txt | head -20
          for f in Marlin_src_module_settings.cpp Marlin_src_HAL_STM32_eeprom_bl24cxx.cpp Marlin_src_gcode_eeprom_M500_M504.cpp; do
            test -s "export/pre/$f.i" || { echo "PREPROCESSOR_EXPORT_MISSING=$f.i" >&2; exit 1; }
          done
          test -s export/pre/Marlin_src_module_settings.cpp.macros
          echo 'PREPROCESSOR_EXPORT=PASS' | tee evidence/config_restore/preprocessor_result.txt
      - name: Verified 32-bit host linker preflight (correctly generated C++ source, NO FLASH)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/host_linker
          if grep -F -- '--no-warn-rwx-segments' t401/fullchain.py; then
            echo 'UNSUPPORTED_LINKER_FLAG_REMAINS' >&2; exit 1
          fi
          python3 - <<'PYHOST'
          import pathlib, subprocess
          p=pathlib.Path('evidence/host_linker')
          source=p/'check.cpp'
          source.write_text('extern "C" void _start() { for (;;) {} }\n')
          cmd=['g++','-m32','-nostdlib','-static','-fno-pie','-no-pie','-Wl,-m,elf_i386','-o',str(p/'check'),str(source)]
          r=subprocess.run(cmd,capture_output=True,text=True)
          (p/'cmd.txt').write_text(' '.join(cmd)+'\n')
          (p/'stderr.txt').write_text(r.stderr)
          assert r.returncode==0,'HOST_LINKER_PREFLIGHT_FAILED'
          print('HOST_LINKER_PREFLIGHT=PASS')
          PYHOST
      - name: EEPROM full chain 401 on the REAL 396 preprocessed tree (real sv04_eeprom_gcode_idle, 328B + 377 + 391-396, before/after, negative and mutation tests)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence/eeprom401
          rc=0
          for f in Marlin_src_module_settings.cpp Marlin_src_HAL_STM32_eeprom_bl24cxx.cpp Marlin_src_gcode_eeprom_M500_M504.cpp; do test -s "export/pre/$f.i" || { echo "FEHLT export/pre/$f.i"; rc=1; }; done
          for sym in EXTENSIBLE_UI EEPROM_AUTO_INIT IIC_BL24CXX_EEPROM; do
            if grep -Eq "^#define $sym( |$)" export/pre/Marlin_src_module_settings.cpp.macros; then echo "$sym=DEFINIERT"; else echo "$sym=NICHT_DEFINIERT"; fi
          done | tee evidence/eeprom401/flags.txt
          if [ "$rc" -eq 0 ]; then
            python3 -I t401/test_401.py export/pre evidence/eeprom401/lauf 2>&1 | tee evidence/eeprom401/stdout.txt
            [ "${PIPESTATUS[0]}" -eq 0 ] || rc=1
            python3 -I t401/check_crc16.py export/pre/Marlin_src_libs_crc16.cpp.i evidence/eeprom401/crc16 2>&1 | tee evidence/eeprom401/crc16.txt
            grep -F "CRC16_EQUIV faelle=8000 abweichungen=0" evidence/eeprom401/crc16.txt || rc=1
          fi
          echo "SV04_401_EEPROM_FULLCHAIN_RC=$rc FLASH_ALLOWED=NO HARDWARE_TESTED=NO" | tee evidence/eeprom401/result.txt
          exit "$rc"
      - name: Summary of verified v434 modified source
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'SV04 NEXT 435 W72: REAL modified 434 DWIN source, not baseline-only'
            echo 'BASE423 PATCH: '$(cat evidence/v424/result.txt | tr '\n' ' ')
            echo 'DWIN434 PATCH: '$(cat evidence/v435/result.txt | tr '\n' ' ')
            cat evidence/v435/postbuild.txt
            for p in integrated_backend integrated_failclosed; do echo "STM32 $p: $(grep BUILD_EXIT evidence/build/$p/result.txt)"; done
            echo "EEPROM full chain: $(cat evidence/eeprom401/result.txt)"
            echo 'Baseline 378-380 native: '$(grep -h T380_RESULT evidence/t380/stdout.txt | tail -1)
            echo 'DWIN HMI graphics project: MISSING; HARDWARE_TESTED=NO; FLASH_ALLOWED=NO'
          } | tee evidence/SUMMARY.txt
      - name: Final result gate (both STM32 builds AND EEPROM full chain)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for profile in integrated_backend integrated_failclosed; do
            grep -qx 'BUILD_EXIT=0' <(grep '^BUILD_EXIT=' "evidence/build/$profile/result.txt") || {
              echo "STM32_BUILD_NOT_VERIFIED=$profile"; exit 1;
            }
          done
          grep -Fq 'SV04_401_EEPROM_FULLCHAIN_RC=0 ' evidence/eeprom401/result.txt
          grep -Fq 'T380_RESULT PASS' evidence/t380/stdout.txt
          grep -Fxq 'W70_PATCH_APPLIED=PASS' evidence/v424/result.txt
          grep -Fxq 'W72_STM32_434_SOURCE_LOCK=PASS' evidence/v435/postbuild.txt
          echo 'W72_MODIFIED_434_SOFTWARE_VERIFICATION=PASS FLASH_ALLOWED=NO HARDWARE_TESTED=NO' | tee evidence/W72_VERDICT.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV04_435_W72_EVIDENCE_NO_FLASH
          path: |
            evidence
            export/pre/LOG.txt
            export/pre/SHA256SUMS.txt
          retention-days: 30
      - name: Upload compiled firmware files (NOT approved for flashing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV04_435_W72_BINARIES_NO_FLASH_APPROVAL
          path: bin
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload preprocessor extracts (diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV04_435_W72_PREPROCESSOR
          path: export/pre
          if-no-files-found: ignore
          retention-days: 14
