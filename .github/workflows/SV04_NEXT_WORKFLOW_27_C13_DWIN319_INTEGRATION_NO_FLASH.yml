          import pathlib, hashlib, base64
          src=pathlib.Path('oem_c13/Marlin/src/lcd/e3v2/creality/LCD_RTS.cpp')
          expected='0d8ef04dac43935d917d77a7c0efd269361b924b26270ccee85fadba9171a94c'
          actual=hashlib.sha256(src.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit('DWIN 318 source SHA256 mismatch: ' + actual)
          encoded=''
          data=base64.b64decode(''.join(encoded.split()),validate=True)
          patch=pathlib.Path('dwin319_27.patch')
          patch.write_bytes(data)
          assert hashlib.sha256(data).hexdigest() == 'af8eff98113d7537c1dbd601c70738bc17b186b4b3daea1e3777a0f7a4e0391a'
          print('DWIN_INPUT_HASH=OK')
          PYDWIN
          git -C oem_c13 apply --check ../dwin319_27.patch
