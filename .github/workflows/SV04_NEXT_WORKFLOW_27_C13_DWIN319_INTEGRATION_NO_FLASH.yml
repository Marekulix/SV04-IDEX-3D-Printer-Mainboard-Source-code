          echo "F12=$F12" | tee -a evidence/input_names.txt
          echo "ab2209676008532b4985fa20063a1115724bb09aeaab9cd378078341d214cbf5  $F12" | sha256sum -c - | tee evidence/input_c12_sha.txt
          unzip -t "$F12" > evidence/zip_c12_integrity.txt
          unzip -q "$F12" -d c12pkg
          F13="$(resolve SV04_NEXT_CLAUDE_C13_IDEX_G28_SAFETY 79c81a07b09a298faed58f16f6681116ec615ba3134230966231cb35282b758e)"
          echo "F13=$F13" | tee -a evidence/input_names.txt
          echo "79c81a07b09a298faed58f16f6681116ec615ba3134230966231cb35282b758e  $F13" | sha256sum -c - | tee evidence/input_c13_sha.txt
          unzip -t "$F13" > evidence/zip_c13_integrity.txt
          unzip -q "$F13" -d c13pkg
