      - name: Build STM32 profiles independently, framework-first, NO FLASH
        shell: bash
        run: |
          # NEVER call `pio run -t clean` before framework is installed.
          # On a virgin runner this invokes generic_create_variant.py before
          # framework-arduinoststm32 exists (verified failure in GitHub 308).
          # A standard first `pio run` installs framework BEFORE pre scripts;
          # this sequence is proven by BOTH successful 291 STM32 build logs.
          set +e
          fail=0
          for profile in integrated_backend integrated_failclosed; do
            mkdir -p "evidence/c13/$profile"
            # Invalidate generated object files, NOT package/toolchain caches.
            # This prevents accidentally reusing backend objects in failclosed.
            rm -rf oem_c13/.pio/build/STM32F103RET6_creality
            if [ "$profile" = integrated_failclosed ]; then
              export PLATFORMIO_BUILD_FLAGS='-DSV04_CLAUDE_HOME_BACKEND_AVAILABLE=0'
            else
              export PLATFORMIO_BUILD_FLAGS=''
            fi
            /tmp/sv04_pio_309/bin/pio run -d oem_c13 -e STM32F103RET6_creality > "evidence/c13/$profile/build.log" 2>&1
            build_rc=$?
            # Exit 0 alone is not accepted without the PIO SUCCESS marker.
            if [ "$build_rc" -eq 0 ] && ! grep -Fq '[SUCCESS]' "evidence/c13/$profile/build.log"; then
              echo 'FAIL: PIO exit 0 without a build SUCCESS marker' >> "evidence/c13/$profile/build.log"
              build_rc=42
            fi
            if [ "$build_rc" -eq 0 ]; then
              mkdir -p "bin/$profile"
              find oem_c13/.pio/build/STM32F103RET6_creality -maxdepth 1 -type f \( -name '*.bin' -o -name 'firmware.elf' \) -exec cp {} "bin/$profile/" \;
              (cd "bin/$profile" && sha256sum * > SHA256SUMS.txt 2>/dev/null) || true
              echo 'C13+DWIN319: DEVELOPMENT ONLY. FLASH_ALLOWED=NO HARDWARE_TESTED=NO. DWIN homing and HMI safety still unverified.' > "bin/$profile/NOT_APPROVED.txt"
            fi
            {
              echo "BUILD_TREE=oem_c13"
              echo "PROFILE=$profile"
              echo 'BUILD_STRATEGY=FRAMEWORK_FIRST_DIRECT_PIO_RUN'
              echo 'SOURCE_BASE=ROUTE_B_C13_PLUS_DWIN319_ON_C12_ON_C11_ON_C10_ON_C9_ON_318_NEW_COPY'
              echo "BUILD_EXIT=$build_rc"
              echo 'FLASH_ALLOWED=NO'
              echo 'HARDWARE_TESTED=NO'
            } | tee "evidence/c13/$profile/result.txt"
            grep -nE 'fatal error:|error:|undefined reference|SUCCESS|FAILED' "evidence/c13/$profile/build.log" > "evidence/c13/$profile/errors.txt" || true
            grep -nE 'warning:' "evidence/c13/$profile/build.log" > "evidence/c13/$profile/warnings.txt" || true
            grep -nE 'RAM:|Flash:' "evidence/c13/$profile/build.log" > "evidence/c13/$profile/ram_flash.txt" || true
            grep -nE 'framework-arduinoststm32|toolchain-gccarmnoneeabi|PACKAGES:' "evidence/c13/$profile/build.log" > "evidence/c13/$profile/framework_packages.txt" || true
            tail -n 45 "evidence/c13/$profile/build.log"
            if [ "$build_rc" -ne 0 ]; then fail=1; fi
          done
          exit "$fail"

      - name: Upload compiled firmware files (NOT approved for flashing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV04_C13_DWIN319_INTEGRATED_BINARIES_NO_FLASH_APPROVAL
