      - name: Export sources and preprocessor extracts for the next test round (NON-FATAL, no effect on build result)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          unset PLATFORMIO_BUILD_FLAGS
          mkdir -p export/src export/pre
          for n in recovery.cpp powerloss.cpp G28.cpp tool_change.cpp planner.cpp motion.cpp MarlinCore.cpp stepper.cpp endstops.cpp probe.cpp; do
            find oem_c13/Marlin/src -name "$n" -print | while read -r f; do mkdir -p "export/src/$(dirname "${f#oem_c13/}")"; cp "$f" "export/src/${f#oem_c13/}"; done
          done
          cp oem_c13/Marlin/Configuration.h oem_c13/Marlin/Configuration_adv.h export/src/ 2>/dev/null
          (cd export && find src -type f | sort | xargs sha256sum > SHA256SUMS.txt)
          /tmp/sv04_pio_309/bin/pio run -d oem_c13 -e STM32F103RET6_creality -t compiledb > export/pre/compiledb.log 2>&1
          python3 - <<'PYX' > export/pre/LOG.txt 2>&1
          import json, re, shlex, subprocess, os, glob
          db = glob.glob('oem_c13/compile_commands.json') + glob.glob('oem_c13/.pio/build/*/compile_commands.json')
          print('compile_commands:', db)
          if db:
              ents = json.load(open(db[0]))
              want = ('G28.cpp', 'tool_change.cpp', 'planner.cpp', 'motion.cpp', 'MarlinCore.cpp', 'recovery.cpp', 'powerloss.cpp', 'endstops.cpp', 'probe.cpp')
              for e in ents:
                  f = e['file']
                  if os.path.basename(f) not in want: continue
                  cmd = e.get('command') or ' '.join(e['arguments'])
                  a = shlex.split(cmd); out = []
                  i = 0
                  while i < len(a):
                      if a[i] == '-o': i += 2; continue
                      if a[i] == '-c': i += 1; continue
                      out.append(a[i]); i += 1
                  base = re.sub(r'[^A-Za-z0-9_.]+', '_', os.path.relpath(f, 'oem_c13'))
                  for flag, suf in (('-E', '.i'), ('-E -dM', '.macros')):
                      r = subprocess.run(out + flag.split() + ['-o', 'export/pre/' + base + suf], capture_output=True, text=True, cwd=e.get('directory', '.'))
                      print(base, flag, 'rc=%d' % r.returncode, r.stderr[:200].replace('\n', ' '))
          PYX
          (cd export && find pre -type f | sort | xargs sha256sum >> SHA256SUMS.txt)
          du -sh export
      - name: Upload source export (diagnostic only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SV04_C13_DWIN319_SOURCE_EXPORT_DIAGNOSTIC
          path: export/
