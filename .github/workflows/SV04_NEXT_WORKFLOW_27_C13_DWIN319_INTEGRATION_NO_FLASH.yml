            shopt -s nullglob
            for f in "$prefix"*.zip; do
              if [ "$(sha256sum -- "$f" | cut -d' ' -f1)" = "$hash" ]; then printf '%s' "$f"; return 0; fi
            done
            echo "FEHLT: keine Datei '$prefix*.zip' mit sha256 $hash im Repository-Stamm" >&2; ls -la >&2; return 1
          }
          mkdir -p evidence c318 c9pkg c10pkg c11pkg c12pkg c13pkg
          F318="$(resolve SV04_NEXT_318_GITHUB_UPLOAD_06 b474d80ac3d67a8f5f4f81d8a9c0e7fa1d24996c738b2e6b7001aefce15a18dd)"
          echo "F318=$F318" | tee -a evidence/input_names.txt
          echo "b474d80ac3d67a8f5f4f81d8a9c0e7fa1d24996c738b2e6b7001aefce15a18dd  $F318" | sha256sum -c - | tee evidence/input_318_sha.txt
          unzip -t "$F318" > evidence/zip_318_integrity.txt
          unzip -q "$F318" -d c318
