          echo '911c0ef756288e43ab48fa7e578148d3f599bf674907d54fff46b670b1bc73fd  oem_c13/Marlin/src/lcd/e3v2/creality/LCD_RTS.cpp' | sha256sum -c - | tee evidence/dwin319_hash.txt
